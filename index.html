<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#4F46E5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הכסף שלי">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הכסף שלי · ניהול הכנסות והוצאות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --sunk:#EEF1F7; --ink:#111827; --muted:#6B7280; --line:#E5E8EF;
  --accent:#4F46E5; --accent-soft:#EEF0FF; --accent-ink:#FFFFFF;
  --ess:#3B82F6; --imp:#F59E0B; --opt:#EC4899; --inc:#059669; --exp:#E11D48;
  --inc-soft:#E7F7F0; --exp-soft:#FDECEF; --imp-soft:#FFF5E0;
  --radius-s:10px; --radius-l:18px;
  --shadow:0 1px 2px rgba(17,24,39,.04), 0 8px 24px -14px rgba(17,24,39,.18);
  --serif:"Rubik", "Heebo", "Segoe UI", Arial, sans-serif;
  --sans:"Rubik", "Heebo", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1120; --surface:#131B2E; --sunk:#1B2540; --ink:#E8ECF5; --muted:#94A0B8; --line:#243050;
    --accent:#818CF8; --accent-soft:#1E2550; --accent-ink:#0B1120;
    --ess:#60A5FA; --imp:#FBBF24; --opt:#F472B6; --inc:#34D399; --exp:#FB7185;
    --inc-soft:#0F2A24; --exp-soft:#33141D; --imp-soft:#2E2410;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1120; --surface:#131B2E; --sunk:#1B2540; --ink:#E8ECF5; --muted:#94A0B8; --line:#243050;
  --accent:#818CF8; --accent-soft:#1E2550; --accent-ink:#0B1120;
  --ess:#60A5FA; --imp:#FBBF24; --opt:#F472B6; --inc:#34D399; --exp:#FB7185;
  --inc-soft:#0F2A24; --exp-soft:#33141D; --imp-soft:#2E2410;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.6);
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px 90px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between;
  margin:0 -20px;padding:14px 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.3rem;margin:0;letter-spacing:-.01em}
.brand::before{content:"💰";display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);font-size:1.25rem}
.brand small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.month-ctl{display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.month-ctl button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;color:var(--muted)}
.month-ctl button:hover{background:var(--sunk);color:var(--ink)}
.month-ctl select{border:0;background:transparent;font-weight:600;padding:4px 6px;min-width:130px;text-align:center}
.month-ctl input[type=date]{border:1px solid var(--line)!important;border-radius:8px!important}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:500;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 6px 16px -8px var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.small{padding:5px 11px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* tabs */
nav.tabs{display:flex;gap:6px;margin:6px 0 22px;overflow-x:auto;padding:5px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;padding:9px 14px;cursor:pointer;font-weight:500;color:var(--muted);border-radius:11px;white-space:nowrap;display:flex;gap:7px;align-items:center;transition:background .15s,color .15s}
nav.tabs button:hover{color:var(--ink);background:var(--sunk)}
nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
.status{font-size:.8rem;color:var(--muted);margin:2px 0 8px;display:flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--inc);flex:none}
[hidden]{display:none!important}
h2{font-weight:600;font-size:1.12rem;margin:0 0 12px;letter-spacing:-.005em}
h3{font-size:1rem;font-weight:600;margin:0 0 8px}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid transparent;border-radius:var(--radius-l);padding:20px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.stack>*+*{margin-top:18px}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border-radius:var(--radius-l);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:.86rem}
.kpi-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:1rem;flex:none}
.kpi-val{font-size:clamp(1.25rem,2.4vw,1.65rem);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-delta{font-size:.8rem;font-weight:500}
.delta-good{color:var(--inc)} .delta-bad{color:var(--exp)} .delta-flat{color:var(--muted)}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}

/* hero */
.hero{padding:4px 0 20px}
.hero.panel{padding:20px;margin-bottom:18px}
.hero-line{font-weight:600;font-size:clamp(1.15rem,2.4vw,1.5rem);line-height:1.4;margin:0;max-width:40ch}
.hero-line b{font-weight:700}
.hero-line .inc{color:var(--inc)} .hero-line .exp{color:var(--exp)}
.hero-net{margin-top:6px;font-size:.98rem}
.ledger{margin-top:18px}
.ledger-bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--sunk);gap:3px}
.ledger-bar span{display:block;height:100%;border-radius:999px;transition:width .5s}
.seg-ess{background:var(--ess)} .seg-imp{background:var(--imp)} .seg-opt{background:var(--opt)}
.ledger-legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px}
.legend-item{display:flex;align-items:baseline;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;transform:translateY(1px)}
.legend-item strong{font-size:1.05rem;font-weight:600}

/* bars */
.hbars{list-style:none;margin:0;padding:0}
.hbars li{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:12px;align-items:center;padding:7px 8px;margin:0 -8px;cursor:pointer;border-radius:10px}
.hbars li:hover{background:var(--sunk)}
.hb-track{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden;display:flex}
.hb-track span{height:100%}
.hb-val{font-variant-numeric:tabular-nums;font-weight:600;min-width:70px;text-align:left}
.trend svg{width:100%;height:auto;display:block}
.trend text{font-family:var(--sans);font-size:11px;fill:var(--muted)}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--sunk)}
.b-ess{color:var(--ess);background:color-mix(in srgb,var(--ess) 12%,transparent)} .b-imp{color:var(--imp);background:var(--imp-soft)} .b-opt{color:var(--opt);background:color-mix(in srgb,var(--opt) 12%,transparent)} .b-inc{color:var(--inc);background:var(--inc-soft)}

/* inputs */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input,.filters select,.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;transition:border-color .15s,box-shadow .15s}
.filters input:focus,.filters select:focus,.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.filters input[type=search]{flex:1;min-width:180px}

/* tables */
.table-wrap{overflow-x:auto;border-radius:var(--radius-l);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:500;color:var(--muted);font-size:.8rem;background:var(--surface);position:sticky;top:0;z-index:1}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.amt{font-variant-numeric:tabular-nums;font-weight:600;text-align:left;white-space:nowrap}
td.amt.inc{color:var(--inc)}
td select{border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:8px;max-width:180px}
td select:hover,td select:focus{border-color:var(--line);background:var(--surface)}
.uncat select{color:var(--exp);font-weight:600}
.row-actions{white-space:nowrap}
.icon-btn{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:6px 8px;border-radius:8px}
.icon-btn:hover{color:var(--ink);background:var(--sunk)}
.cat-btn{border:0;background:var(--sunk);padding:4px 10px;border-radius:999px;cursor:pointer;text-align:right;font-weight:500;font-size:.88rem;white-space:nowrap}
.cat-btn:hover,.cat-btn:focus-visible{background:var(--accent-soft);color:var(--accent)}
.cat-btn.is-uncat{color:var(--exp);background:var(--exp-soft)}
.desc-btn{border:0;background:transparent;padding:0;cursor:pointer;text-align:right;font:inherit;color:inherit;font-weight:500}
.desc-btn:hover{color:var(--accent)}
.click-row{cursor:pointer}.click-row:hover{background:var(--sunk)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--sunk);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.hist-btn{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:2px 5px;border-radius:6px;font-size:.85rem}
.hist-btn:hover{color:var(--ink);background:var(--sunk)}
.is-excl td{opacity:.45}.is-excl td.amt{text-decoration:line-through}.is-excl td:has(input[data-incl]),.is-excl td:has(input[data-mincl]),.is-excl td:has(input[data-pincl]){opacity:1}
.issue-row td{font-size:.88rem}
.inst-tag{display:inline-block;font-size:.74rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;margin-inline-start:6px;white-space:nowrap}
.prog{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden;min-width:90px}.prog span{display:block;height:100%;background:var(--accent);border-radius:999px}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;cursor:pointer}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
input[type=checkbox]{width:17px;height:17px}
.card-tag{font-size:.84rem;white-space:nowrap;color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.08rem;margin-bottom:6px;font-weight:600}
.empty::before{content:"🗂️";display:block;font-size:2rem;margin-bottom:8px}

/* forms & dialogs */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.82rem;font-weight:500;color:var(--muted)}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;cursor:pointer;font-weight:500;border-radius:9px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(17,24,39,.12);font-weight:600}
dialog{border:0;border-radius:22px;background:var(--surface);color:var(--ink);padding:24px;width:min(560px,94vw);box-shadow:0 30px 60px -20px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(15,23,42,.45);backdrop-filter:blur(3px)}
dialog h2{font-size:1.2rem}
.dlg-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:20px}

/* import */
.drop{border:2px dashed var(--line);border-radius:var(--radius-l);padding:38px 20px;text-align:center;background:var(--surface);cursor:pointer;transition:border-color .2s,background .2s}
.drop::before{content:"📥";display:block;font-size:2rem;margin-bottom:6px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{font-size:1.08rem;display:block;margin-bottom:4px;font-weight:600}
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}

/* categories */
.topic-block{margin-bottom:22px}
.topic-block h3{font-size:1rem;border-bottom:1px solid var(--line);padding-bottom:8px}
.cat-row{display:grid;grid-template-columns:minmax(140px,1.2fr) 120px 120px minmax(160px,2fr) auto;gap:8px;align-items:center;padding:6px 0}
.cat-row input,.cat-row select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 9px;width:100%}
@media (max-width:760px){.cat-row{grid-template-columns:1fr 1fr}.cat-row .kw{grid-column:1/-1}}

/* savings */
.sav-hero{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-end}
.sav-num{font-weight:700;font-size:clamp(2rem,5vw,2.8rem);line-height:1;color:var(--inc)}
.slider-row{display:flex;align-items:center;gap:12px;margin-top:10px}
.slider-row input[type=range]{width:220px}
.sav-list{list-style:none;margin:0;padding:0}
.sav-list li{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 16px}
.sav-list li:last-child{border-bottom:0}
.sav-list .tip{grid-column:1/-1;font-size:.9rem;color:var(--muted)}
.sav-list .amt{font-weight:600;font-variant-numeric:tabular-nums;text-align:left}
.ai-out{white-space:pre-wrap;line-height:1.75;margin-top:12px}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;display:flex;gap:12px;align-items:center;z-index:60;max-width:92vw;box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:3px 10px;cursor:pointer;font-weight:600}
.toast[hidden]{display:none}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
code{background:var(--sunk);padding:1px 6px;border-radius:6px;font-size:.88em}

/* bottom navigation (phones) */
.bnav{display:none}
.more-menu{position:fixed;z-index:45;bottom:calc(74px + env(safe-area-inset-bottom,0px));left:12px;right:12px;background:var(--surface);border-radius:18px;box-shadow:0 20px 50px -12px rgba(0,0,0,.35);padding:8px;display:grid;gap:2px}
.more-menu[hidden]{display:none}
.more-menu button{border:0;background:transparent;text-align:right;padding:12px 14px;border-radius:12px;font-weight:500;cursor:pointer;display:flex;gap:10px;align-items:center}
.more-menu button:hover,.more-menu button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}

@media (max-width:760px){
  body{font-size:15px}
  .wrap{padding:0 14px calc(96px + env(safe-area-inset-bottom,0px))}
  header.top{margin:0 -14px;padding:10px 14px;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  header.top > div{display:grid!important;grid-template-columns:auto 1fr;gap:8px!important}
  #rangeCtl{grid-column:1/-1}
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .filters::-webkit-scrollbar{display:none}
  .filters input[type=search]{min-width:150px}
  .filters select{flex:none;max-width:170px}
  .brand{font-size:1.12rem}.brand small{display:none}.brand::before{width:34px;height:34px;font-size:1.05rem}
  header.top > div{width:100%}
  #gBtn{display:none}
  #pmSeg{flex:none}
  #monthCtl,#rangeCtl{flex:1}
  #monthCtl{min-width:0}
  #monthCtl select{flex:1;min-width:0;width:100%}
  #pmSeg button{padding:7px 12px}
  #addBtn{position:fixed;z-index:40;left:16px;bottom:calc(82px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;padding:0;font-size:0;box-shadow:0 12px 24px -8px var(--accent)}
  #addBtn::before{content:"+";font-size:30px;font-weight:400;line-height:1}
  nav.tabs{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;z-index:44;left:0;right:0;bottom:0;background:var(--surface);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px -14px rgba(17,24,39,.35);border-top:1px solid var(--line)}
  .bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.7rem;font-weight:500;color:var(--muted);cursor:pointer;border-radius:12px}
  .bnav button span{font-size:1.25rem;line-height:1.2;filter:grayscale(1);opacity:.7;transition:filter .15s,opacity .15s}
  .bnav button[aria-selected="true"]{color:var(--accent)}
  .bnav button[aria-selected="true"] span{filter:none;opacity:1}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .hbars li{grid-template-columns:90px 1fr auto}
  .panel{padding:16px}
  .grid2{grid-template-columns:1fr}
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:92vh;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
  /* transactions as cards */
  .tx-table thead{display:none}
  .tx-table,.tx-table tbody{display:block}
  .tx-table tr{display:grid;grid-template-columns:1fr auto;grid-template-areas:"desc amt" "cat cat" "meta act";gap:6px 10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .tx-table td{border:0;padding:0;display:block}
  .tx-table .td-desc{grid-area:desc;min-width:0}
  .tx-table .td-amt{grid-area:amt;font-size:1.02rem}
  .tx-table .td-cat{grid-area:cat;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tx-table .td-date,.tx-table .td-nec,.tx-table .td-card,.tx-table .td-incl{display:none}
  .tx-table .td-meta{grid-area:meta;display:flex!important;gap:10px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
  .tx-table .row-actions{grid-area:act;text-align:left}
}
@media (min-width:761px){ .tx-table .td-meta{display:none} }
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">

const Store = {
  mode:'local', db:null, uid:null, chain:{},

    let db=null, user=null;
    if (window.claude && typeof window.claude.use==='function'){
      const t = ms => new Promise(r=>setTimeout(()=>r(null),ms));
      try{ [db,user] = await Promise.all([Promise.race([claude.use('db'),t(9000)]), Promise.race([claude.use('user'),t(9000)])]); }catch(e){}
    }

    return this.load();
  },
  col(){ return this.db.collection('data/users/'+this.uid); },
  async load(){
    const out = {settings:null, months:{}};
    if (this.mode==='cloud'){
      try{
        const snap = await this.col().get();
        snap.docs.forEach(d=>{
          if(!d.exists) return; const v = JSON.parse(JSON.stringify(d.data()));
          if (d.id==='settings') out.settings = v;
          else if (d.id.startsWith('m_')) out.months[d.id.slice(2)] = v.items||[];
        });
        return out;
      }catch(e){ this.mode='local'; }
    }

  },
  write(docId, body){
    if (this.mode!=='cloud'){ this.saveLocal(); return Promise.resolve(); }
    const prev = this.chain[docId] || Promise.resolve();
    const next = prev.then(async ()=>{
      try{
        if (body===null) await this.col().doc(docId).delete();
        else await this.col().doc(docId).set(body);
      }catch(e){
        if (e && e.code==='quota_exceeded') toast('האחסון מלא. מחקו חודשים ישנים כדי להמשיך לשמור.');
        else toast('השמירה נכשלה ('+(e&&e.code||'שגיאה')+'). נסו שוב בעוד רגע.');

  },

  saveMonth(k){ const items = S.months[k]||[]; if (ACTIVE) ACTIVE.saveMonth(k); return this.write('m_'+k, items.length?{items}:null); },

function learnedCat(desc, type){
  const learned = S.settings.learned||{};
  for (const k of [norm(desc), stripInst(desc)]) if (learned[k] && cats().some(c=>c.id===learned[k] && (!type || c.kind===type))) return learned[k];
  return null;
}
function kwCat(desc, type){
  const d=norm(desc); let best=null, bestLen=0;
  for (const c of cats()){
    if (type && c.kind!==type) continue;
    for (const k of c.keywords){ const kk=norm(k); if (kk && d.includes(kk) && kk.length>bestLen){ best=c.id; bestLen=kk.length; } }
  }
  return best;
}
// card-company branch names ("ענף") -> our categories; first match wins

  [/ביגוד|אופנה|הנעלה|נעליים/, 'clothes'],
  [/אלקטרוניק|מחשב|ריהוט|לבית|בית וגן|כלי בית|עיצוב|שיפוץ|בניין/, 'home'],
  [/חשמל|גז|מים|אנרגיה/, 'utilities'],
  [/עירי|ממשל|רשויות|ארנונה|מסים/, 'arnona'],
  [/חינוך|לימוד|ספרים|גן |צעצוע|ילדים/, 'education'],
  [/תיירות|טיס|תעופה|מלון|נופש|סוכנויות נסיעות/, 'vacation'],
  [/פנאי|בידור|תרבות|קולנוע|ספורט|כושר|אומנות|מוזיק/, 'fun'],
  [/תרומ|עמות/, 'gifts'],
  [/עמל|בנק|פיננס/, 'fees'],
  [/אינטרנט|מקוון|online|קניות/, 'online']
];
const normBranch = b => String(b??'').trim().replace(/\s+/g,' ');
function branchCat(branch){
  const b=normBranch(branch); if(!b) return null;
  const user=(S.settings.branchMap||{})[b]; if (user && cats().some(c=>c.id===user)) return user;
  return null;
}
function defaultBranchCat(branch){
  const b=normBranch(branch); if(!b) return null;
  for (const [re,id] of BRANCH_RULES) if (re.test(b) && cats().some(c=>c.id===id)) return id;
  return null;
}
function importCat(desc, type, branch){
  return learnedCat(desc,type) || (type==='expense' && branchCat(branch)) || kwCat(desc,type) || (type==='expense' && defaultBranchCat(branch)) || (type==='income' ? 'extra_inc' : 'uncat');
}
function autoCat(desc, type){
  const d = norm(desc);
  const lc = learnedCat(desc, type); if (lc) return lc;
  let best=null, bestLen=0;
  for (const c of cats()){
    if (type && c.kind!==type) continue;
    for (const k of c.keywords){ const kk=norm(k); if (kk && d.includes(kk) && kk.length>bestLen){ best=c.id; bestLen=kk.length; } }
  }
  return best || (type==='income' ? 'extra_inc' : 'uncat');
}

function totals(list){
  const r = {inc:0, exp:0, essential:0, important:0, optional:0, byCat:{}, byTopic:{}, byCard:{}};
  for (const t of list){
    if (t.excluded) continue;
    if (t.type==='income'){ r.inc+=t.amount; continue; }
    r.exp+=t.amount; r[necOf(t)] += t.amount;
    const ck=t.card||''; r.byCard[ck]=(r.byCard[ck]||0)+t.amount;
    r.byCat[t.catId]=(r.byCat[t.catId]||0)+t.amount;
    const tp = catById(t.catId).topic; r.byTopic[tp]=(r.byTopic[tp]||0)+t.amount;
  }
  return r;
}

function addTx(list){
  const touched = new Set();
  for (const t of list){ const k=t.date.slice(0,7); (S.months[k] ||= []).push(t); touched.add(k); }
  touched.forEach(k=>{ S.months[k].sort((a,b)=>b.date.localeCompare(a.date)); Store.saveMonth(k); });
}
function removeTx(id){
  for (const k in S.months){ const i=S.months[k].findIndex(t=>t.id===id); if(i>-1){ const [t]=S.months[k].splice(i,1); Store.saveMonth(k); return t; } }
}
function updateTx(id, patch){
  const old = removeTx(id); if(!old) return;
  addTx([{...old, ...patch}]);
}

function prevPeriodTx(){
  if (!S.range) return monthTx(shiftMonth(S.month,-1));

  const pTo=new Date(new Date(S.range.from).getTime()-864e5), pFrom=new Date(pTo.getTime()-(days-1)*864e5);
  const pf=pFrom.toISOString().slice(0,10), pt=pTo.toISOString().slice(0,10);
  return allTx().filter(t=>t.date>=pf && t.date<=pt);
}
function kpiHTML(T){
  const P=totals(prevPeriodTx()), hasP=P.inc||P.exp, net=T.inc-T.exp, pnet=P.inc-P.exp;
  const rate=T.inc? Math.round(net/T.inc*100) : null, prate=P.inc? Math.round(pnet/P.inc*100) : null;
  const vs = S.range ? 'מהתקופה הקודמת' : 'מהחודש הקודם';
  const delta=(cur,prev,upGood)=>{
    if (!hasP || !prev) return `<span class="kpi-delta delta-flat">${hasP?'—':'אין נתון להשוואה'}</span>`;
    const pct=Math.round((cur-prev)/Math.abs(prev)*100); if (!pct) return `<span class="kpi-delta delta-flat">ללא שינוי ${vs}</span>`;
    const good=(pct>0)===upGood; return `<span class="kpi-delta ${good?'delta-good':'delta-bad'}">${pct>0?'▲':'▼'} ${Math.abs(pct)}% ${vs}</span>`;
  };
  const card=(label,ico,bg,val,color,d)=>`<div class="kpi"><div class="kpi-top"><span>${label}</span><span class="kpi-ico" style="background:${bg}">${ico}</span></div><div class="kpi-val" style="color:${color}">${val}</div>${d}</div>`;
  return `<div class="kpis">
    ${card('יתרה','⚖️','var(--accent-soft)',(net<0?'−':'')+fmt(Math.abs(net)),net>=0?'var(--ink)':'var(--exp)',delta(net,pnet,true))}
    ${card('הכנסות','↙️','var(--inc-soft)',fmt(T.inc),'var(--inc)',delta(T.inc,P.inc,true))}
    ${card('הוצאות','↗️','var(--exp-soft)',fmt(T.exp),'var(--exp)',delta(T.exp,P.exp,false))}
    ${card('שיעור חיסכון','🎯','var(--imp-soft)',rate===null?'—':rate+'%','var(--ink)',(rate!==null&&prate!==null&&hasP)?`<span class="kpi-delta ${rate>=prate?'delta-good':'delta-bad'}">${rate===prate?'ללא שינוי':(rate>prate?'▲ ':'▼ ')+Math.abs(rate-prate)+' נק׳'} ${rate===prate?'':vs}</span>`:'<span class="kpi-delta delta-flat">מתוך ההכנסות</span>')}
  </div>`;
}

function trendSVG(){
  let ks=[]; if (S.range){ ks=periodMonths().slice(-24); if(ks.length<2) ks=[shiftMonth(ks[0],-1),ks[0]]; } else for(let i=5;i>=0;i--) ks.push(shiftMonth(S.month,-i));
  const data = ks.map(k=>{ const T=totals(S.range?monthTx(k).filter(t=>inRange(t.date)):monthTx(k)); return {k, inc:T.inc, exp:T.exp}; });
  const max = Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
  const W=520,H=220,pad=24,gw=(W-pad*2)/ks.length,bw=Math.max(3,Math.min(22,gw/2-3)), hl=S.range?null:S.month;
  let s=`<svg viewBox="0 0 ${W} ${H+28}" role="img" aria-label="הכנסות והוצאות לפי חודש">`;
  [0.5,1].forEach(f=>{ const y=H-(H-pad)*f; s+=`<line x1="${pad}" x2="${W-pad}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${W-pad+2}" y="${y+4}" text-anchor="start">${fmt(max*f)}</text>`; });
  data.forEach((d,i)=>{
    // RTL: newest on the left
    const cx = W - pad - gw*(i+0.5);
    const hi=(H-pad)*d.inc/max, he=(H-pad)*d.exp/max;
    s+=`<rect x="${cx}" y="${H-hi}" width="${bw}" height="${hi}" rx="3" fill="var(--inc)"><title>הכנסות ${fmt(d.inc)}</title></rect>`;
    s+=`<rect x="${cx-bw-3}" y="${H-he}" width="${bw}" height="${he}" rx="3" fill="var(--exp)" opacity="${!hl||d.k===hl?1:.75}"><title>הוצאות ${fmt(d.exp)}</title></rect>`;
    if (ks.length<=8 || i%Math.ceil(ks.length/8)===0) s+=`<text x="${cx}" y="${H+18}" text-anchor="middle" style="${d.k===hl?'font-weight:700;fill:var(--ink)':''}">${ks.length>6?monthName(d.k).slice(0,3)+" '"+d.k.slice(2,4):monthName(d.k)}</text>`;
  });
  s+=`<line x1="${pad}" x2="${W-pad}" y1="${H}" y2="${H}" stroke="var(--line)"/></svg>`;
  return s;
}

function setIncluded(txs, inc){
  txs.forEach(t=>updateTx(t.id,{excluded:!inc}));

}
function learnCat(desc, catId){ const L=(S.settings.learned ||= {}); L[stripInst(desc)]=catId; L[norm(desc)]=catId; Store.saveSettings(); }
function sameNameTx(desc, type, excludeIds){ const key=stripInst(desc); return allTx().filter(t=>t.type===type && stripInst(t.desc)===key && !excludeIds.includes(t.id)); }
function pickForTx(txs, opts={}){
  const t=txs[0], ids=txs.map(x=>x.id), same=sameNameTx(t.desc,t.type,ids);
  openCatPicker({desc:t.desc, type:t.type, catId:t.catId, sameCount:same.length, sameDiff:same.filter(x=>x.catId!==t.catId).length, groupCount:txs.length, groupLabel:opts.groupLabel,
    apply:(catId,all,learn)=>{
      const list = all ? txs.concat(sameNameTx(t.desc,t.type,ids)) : txs;
      list.forEach(x=>{ if(x.catId!==catId) updateTx(x.id,{catId}); });
      if (learn) learnCat(t.desc, catId);
      render(); if (document.getElementById('merchDlg').open) renderMerch(); toast(list.length>1?`הסיווג עודכן ב-${list.length} עסקאות`:'הסיווג עודכן');
    }});
}

/* ---------- import ---------- */
function decodeText(buf){
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf).replace(/^\uFEFF/,''); }
  catch(e){ try{ return new TextDecoder('windows-1255').decode(buf); }catch(_){ return new TextDecoder().decode(buf); } }
}
async function readFile(file){
  if (typeof XLSX==='undefined') throw new Error('ספריית קריאת הקבצים לא נטענה. רעננו את העמוד ונסו שוב.');
  const buf = await file.arrayBuffer();
  const isText = /\.(csv|txt|tsv)$/i.test(file.name);
  const wb = isText ? XLSX.read(decodeText(buf),{type:'string',raw:true}) : XLSX.read(buf,{type:'array',cellDates:true});
  // read every sheet; sections and repeated header rows are handled in buildImport
  let rows=[], sheets=0;
  wb.SheetNames.forEach(n=>{ const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}).filter(x=>x.some(c=>String(c).trim()!=='')); if(r.length){ sheets++; rows=rows.concat(r); } });
  rows.sheets=sheets;

}

const isLoanCat = c => !!c && c.kind==='expense' && (c.id==='loans' || c.loan || /הלוואה|הלוואות/.test(c.name));
function loanList(){
  const groups={}, L=S.settings.loans||{}, ref=refMonth();
  allTx().filter(t=>t.type==='expense' && !t.excluded && isLoanCat(catById(t.catId))).forEach(t=>{ const k=t.loanKey||('k:'+merchKey(t.desc)); (groups[k] ||= []).push(t); });
  Object.keys(L).forEach(k=>{ if(!groups[k] && L[k].manual) groups[k]=[]; });
  return Object.entries(groups).map(([key,txs])=>{
    txs.sort((a,b)=>a.date.localeCompare(b.date));
    const d=L[key]||{}, toRef=txs.filter(t=>t.date.slice(0,7)<=ref), last=txs[txs.length-1], lastRef=toRef[toRef.length-1];
    const monthly = +d.monthly || (lastRef||last||{}).amount || 0, N = +d.months || 0;
    let n;
    if (txs.length) n = toRef.length + (+d.offset||0);
    else n = d.start ? Math.max(0, mDiff(ref, d.start)+1) : 0;
    if (N) n=Math.max(0,Math.min(n,N));
    const left = N ? N-n : null;
    const lastM = lastRef ? lastRef.date.slice(0,7) : (d.start && n ? shiftMonth(d.start,n-1) : ref);
    const start = d.start || (n ? shiftMonth(lastM, -(n-1)) : null);
    const total=+d.total||0;
    return {key, d, txs, toRef, name:d.name || (last?last.desc:'הלוואה'), desc:last?last.desc:'', monthly, N, n, left,

      paid: toRef.reduce((a,t)=>a+t.amount,0), total, interest: N&&total ? N*monthly-total : null, done: left===0, card:(last||{}).card};
  });
}

/* ---------- installments ---------- */
const mDiff=(a,b)=>{ const [ay,am]=a.split('-').map(Number), [by,bm]=b.split('-').map(Number); return (ay-by)*12+(am-bm); };
const stripInst = s => norm(s).replace(/תשלום\s*\d+\s*(מתוך|מ-|\/)\s*\d+/g,'').replace(/\d+\s*מתוך\s*\d+/g,'').trim();
function plans(){
  const byKey={};
  allTx().filter(t=>t.inst && t.type==='expense' && !t.excluded).forEach(t=>{
    const start=shiftMonth(t.date.slice(0,7), -(t.inst.n-1));
    (byKey[stripInst(t.desc)+'|'+t.inst.of+'|'+(t.card||'')] ||= []).push({t,start});
  });
  const out=[];
  Object.values(byKey).forEach(arr=>{
    arr.sort((a,b)=>a.start.localeCompare(b.start));
    let cur=null;
    arr.forEach(({t,start})=>{
      // charges of one purchase may drift by a month because of billing dates
      if (!cur || Math.abs(mDiff(start,cur.start))>1){ cur={desc:t.desc, card:t.card, catId:t.catId, of:t.inst.of, start, last:t, txs:[], total:0}; out.push(cur); }
      cur.txs.push(t);
      if (t.inst.n>cur.last.inst.n || (t.inst.n===cur.last.inst.n && t.date>cur.last.date)) cur.last=t;
      if (t.inst.total) cur.total=t.inst.total;
    });
  });
  out.forEach(p=>{ p.start=shiftMonth(p.last.date.slice(0,7), -(p.last.inst.n-1)); p.amount=p.last.amount; p.looksTotal = p.txs.every(t=>!t.inst.split && t.inst.total && t.amount>=t.inst.total*0.98); p.end=shiftMonth(p.start,p.of-1); if(!p.total) p.total=p.amount*p.of; });
  return out;
}
function planAt(p, ref){
  const nAt=Math.max(0, Math.min(p.of, mDiff(ref,p.start)+1));
  return {nAt, left:p.of-nAt, leftAmt:(p.of-nAt)*p.amount, active:nAt>=1 && nAt<p.of, done:nAt>=p.of};
}
function unsplitPlans(ps){
  const backup=[];
  ps.forEach(p=>p.txs.forEach(t=>{ if(!t.inst.split) return; backup.push({id:t.id, amount:t.amount, inst:{...t.inst}}); const {split,total,...rest}=t.inst; updateTx(t.id,{amount:t.inst.total, inst:rest}); }));
  render(); toast(`החלוקה בוטלה ב-${backup.length} חיובים`,[{label:'ביטול',fn:()=>{ backup.forEach(b=>updateTx(b.id,{amount:b.amount, inst:b.inst})); render(); }}]);
}
function setPlanAmount(p, amt){
  const backup=p.txs.map(t=>({id:t.id, amount:t.amount, inst:{...t.inst}}));
  p.txs.forEach(t=>{ const {split,derived,...rest}=t.inst; const total = rest.total && nearAmt(amt*p.of, rest.total) ? rest.total : r2(amt*p.of); updateTx(t.id,{amount:amt, inst:{...rest, total}}); });
  render(); toast(`התשלום החודשי עודכן ל-${fmt2(amt)}`,[{label:'ביטול',fn:()=>{ backup.forEach(b=>updateTx(b.id,{amount:b.amount, inst:b.inst})); render(); }}]);
}
const fileLabel = t => (t.fileId && S.settings.files && S.settings.files[t.fileId]) ? S.settings.files[t.fileId].name : 'קובץ אחר';
function planIssues(p){
  const issues=[];
  const byM={}; p.txs.forEach(t=>(byM[t.date.slice(0,7)] ||= []).push(t));
  // the same monthly charge recorded twice (e.g. in a general file and in the card's charges file)
  const dups=[]; Object.values(byM).forEach(arr=>{ const seen=[]; arr.forEach(t=>{ if(seen.some(s=>nearAmt(s.amount,t.amount))) dups.push(t); else seen.push(t); }); });
  if (dups.length) issues.push({msg:`${dups.length} חיובים מופיעים פעמיים באותו חודש (${[...new Set(dups.map(fileLabel))].map(esc).join(', ')}).`, acts:[{label:'החרגת הכפילויות מהדוחות', fn:()=>setIncluded(dups,false)}]});
  // conflicting monthly amounts for the same deal
  const amts=[]; p.txs.forEach(t=>{ if(!amts.some(a=>nearAmt(a.v,t.amount))) amts.push({v:t.amount, files:new Set([fileLabel(t)])}); else amts.find(a=>nearAmt(a.v,t.amount)).files.add(fileLabel(t)); });
  if (amts.length>1){
    const trusted = (p.txs.find(t=>t.inst.total && !t.inst.split)||{inst:{}}).inst.total;
    const best = trusted ? amts.find(a=>nearAmt(a.v*p.of,trusted)) : null;
    issues.push({msg:`לאותה עסקה נקלטו סכומי תשלום שונים: ${amts.map(a=>fmt2(a.v)+' ('+[...a.files].map(esc).join(', ')+')').join(' / ')}.${best?` לפי סכום העסקה ${fmt(trusted)}, התשלום הנכון הוא ${fmt2(best.v)}.`:''}`,
      acts: amts.map(a=>({label:`התשלום החודשי הוא ${fmt2(a.v)}`, fn:()=>setPlanAmount(p,a.v), primary: best===a}))});
  }
  if (p.txs.some(t=>t.inst.split)) issues.push({msg:`הסכום חולק ידנית במספר התשלומים (לפני החלוקה: ${fmt2(p.txs.find(t=>t.inst.split).inst.total)}). אם התשלום נראה קטן מדי, בטלו את החלוקה.`, acts:[{label:'ביטול החלוקה', fn:()=>unsplitPlans([p])}]});
  const tk=p.txs.find(t=>t.inst.total && !t.inst.split)?.inst.total;
  if (tk && amts.length===1 && !nearAmt(p.amount*p.of, tk) && !nearAmt(p.amount, tk)) issues.push({msg:`${fmt2(p.amount)} × ${p.of} תשלומים = ${fmt(p.amount*p.of)}, אבל סכום העסקה בקובץ הוא ${fmt(tk)}.`, acts:[{label:`התשלום החודשי הוא ${fmt2(r2(tk/p.of))}`, fn:()=>setPlanAmount(p,r2(tk/p.of))}]});
  // the full deal amount recorded as a regular charge in another file
  const k=merchKey(p.desc), months=Object.keys(byM);
  const full=allTx().filter(o=>!o.excluded && !o.inst && o.type==='expense' && !p.txs.includes(o) && merchKey(o.desc)===k && (!p.card||!o.card||o.card===p.card) && months.concat([p.start]).some(mo=>Math.abs(mDiff(o.date.slice(0,7),mo))<=1) && nearAmt(o.amount, p.amount*p.of));
  if (full.length) issues.push({msg:`בקובץ ${esc(fileLabel(full[0]))} מופיע חיוב של ${fmt(full[0].amount)}, סכום העסקה המלא, כחיוב רגיל. זו כנראה אותה עסקה, שנספרת פעמיים.`, acts:[{label:'החרגת החיוב המלא מהדוחות', fn:()=>setIncluded(full,false)}]});
  return issues;
}
function splitPlans(ps){
  const backup=[];
  ps.forEach(p=>p.txs.forEach(t=>{ backup.push({id:t.id, amount:t.amount, inst:{...t.inst}}); updateTx(t.id,{amount:Math.round(t.amount/t.inst.of*100)/100, inst:{...t.inst, total:t.amount, split:true}}); }));
  render(); toast(`תוקנו ${ps.length} עסקאות (${backup.length} חיובים)`,[{label:'ביטול',fn:()=>{ backup.forEach(b=>updateTx(b.id,{amount:b.amount, inst:b.inst})); render(); }}]);
}
function loadIn(month){ return plans().reduce((a,p)=> a + (mDiff(month,p.start)>=0 && mDiff(p.end,month)>=0 ? p.amount : 0), 0); }
const nextLoad = () => loadIn(shiftMonth(refMonth(),1));
function renderInst(){

/* ---------- import helpers & linked folder ---------- */
function removeByFile(fid){
  const removed=[], touched=new Set();
  for (const k in S.months){ const before=S.months[k].length; S.months[k]=S.months[k].filter(t=>{ if(t.fileId===fid){ removed.push(t); return false; } return true; }); if(S.months[k].length!==before) touched.add(k); }
  touched.forEach(k=>Store.saveMonth(k));
  return removed;
}
function commitImport(out, fills=[]){
  const I=S.imp, fid=I.replaceFileId || ('f_'+uid());
  let carried=0;
  if (I.replaceFileId){
    const old=removeByFile(fid), idx=new Map(old.map(t=>[t.date+'|'+norm(t.desc)+'|'+t.type+'|'+t.amount.toFixed(2), t]));
    out.forEach(t=>{ const o=idx.get(t.date+'|'+norm(t.desc)+'|'+t.type+'|'+t.amount.toFixed(2)); if(o){ t.catId=o.catId; t.excluded=!!o.excluded; if(o.note) t.note=o.note; if(o.nec) t.nec=o.nec; carried++; } });
  }
  out.forEach(t=>{ delete t._row; t.fileId=fid; });
  fills.forEach(f=>updateTx(f.id,{inst:f.inst}));
  const cmap={}; out.forEach(t=>{ const n=t.cardName; delete t.cardName; t.card = n ? (cmap[n] ||= ensureCard(n)) : null; });
  if (out.length) addTx(out);
  const ds=out.map(t=>t.date).sort();
  const {headers, ...map}=I.map;
  (S.settings.files ||= {})[fid]={id:fid, name:I.name, path:I.path||('upload:'+I.name), mime:I.mime||null,
    source: (I.path||'').startsWith('gdrive:') ? 'drive' : (I.item||(I.path&&!I.path.startsWith('upload:'))) ? 'folder' : 'upload',
    kind:I.map.kind||null, cardName:I.cardName||'', importedAt:new Date().toISOString(), count:out.length, from:ds[0]||null, to:ds[ds.length-1]||null, map};
  Store.saveSettings();
  IDB.set('rows:'+fid, {name:I.name, rows:I.rows, sheets:I.rows.sheets||1});
  S.lastFid=fid;
  const uncat=out.filter(t=>t.catId==='uncat').length;
  if (S.batch){ S.batch.files++; S.batch.tx+=out.length; S.batch.uncat+=uncat; out.forEach(t=>S.batch.months.add(t.date.slice(0,7))); }
  return uncat;
}
const sigOf = row => (row||[]).map(c=>norm(c)).filter(Boolean).join('|');
function saveProfile(){
  const I=S.imp, sig=sigOf(I.rows[I.map.hi]); if(!sig) return;
  const {headers, ...map} = I.map;
  (S.settings.importProfiles ||= {})[sig]={map, cardName:I.cardName||''}; Store.saveSettings();
}
function findProfile(rows){
  const P=S.settings.importProfiles||{};
  for (let i=0;i<Math.min(rows.length,25);i++){ const sig=sigOf(rows[i]); if(sig && P[sig]){ const map={...P[sig].map, hi:i, headers:rows[i].map(c=>String(c).trim())}; if(!map.kind) map.kind = map.mode==='posExpense'?'credit':'bank'; if(map.branchCol===undefined) map.branchCol=detectBranchCol(map.headers); return {map, cardName:P[sig].cardName, sig}; } }
  return null;
}
function cardFromName(n){
  const ms=String(n).replace(/\.[^.]+$/,'').match(/(?<!\d)\d{4}(?!\d)/g)||[];
  const d=ms.find(x=>!(+x>=1990 && +x<=2099)); return d? 'כרטיס '+d : '';

const PROJ = {

  async load(){
    const c=await this.readJSON(this.dir,'categories.json'), s=await this.readJSON(this.dir,'settings.json');
    const months={};
    try{ const td=await this.dir.getDirectoryHandle('transactions');
      for await (const [n,hd] of td.entries()){ const m=n.match(/^(\d{4}-\d{2})\.json$/); if(hd.kind==='file' && m){ const r=await this.readJSON(td,n); if(r && Array.isArray(r.data.items)) months[m[1]]=r.data.items; } } }catch(e){}
    this.catMod=c?c.mod:0;
    if (!c && !s && !Object.keys(months).length) return null;
    return {settings:{...(s?s.data:{}), categories:c&&Array.isArray(c.data.categories)?c.data.categories:null, learned:(c&&c.data.learned)||{}}, months};
  },
  queue(path, getObj){
    clearTimeout(this.timers[path]);
    this.timers[path]=setTimeout(()=>{ const prev=this.chains[path]||Promise.resolve(); this.chains[path]=prev.then(()=>this.writeNow(path,getObj())); },200);
  },

    if (!this.dir) return;
    try{
      let d=this.dir; const parts=path.split('/'), name=parts.pop();
      for (const p of parts) d=await d.getDirectoryHandle(p,{create:true});
      if (obj===null){ try{ await d.removeEntry(name); }catch(e){} return; }
      const fh=await d.getFileHandle(name,{create:true}), w=await fh.createWritable();

  },

const GD = {
  token:null, exp:0, rootId:null, projId:null, dataId:null, txId:null, ids:{}, mod:{}, chains:{}, timers:{}, busy:0,

  folderId(){ try{ return localStorage.getItem('mm-gfolder')||''; }catch(e){ return ''; } },
  signIn(){
    // must run inside a click handler: Google opens its own sign-in popup
    return new Promise((res,rej)=>{
      if (!(window.google && google.accounts && google.accounts.oauth2)) return rej(new Error('nolib'));
      const tc=google.accounts.oauth2.initTokenClient({client_id:this.clientId(), scope:'https://www.googleapis.com/auth/drive',
        callback:r=>{ if(r.error) return rej(new Error(r.error)); if (google.accounts.oauth2.hasGrantedAllScopes && !google.accounts.oauth2.hasGrantedAllScopes(r,'https://www.googleapis.com/auth/drive')) return rej(new Error('scope')); this.token=r.access_token; this.exp=Date.now()+((+r.expires_in||3600)-60)*1000; res(); },

  async api(path, opts={}, raw){

    const r = await fetch(url,{...opts, headers:{...(opts.headers||{}), Authorization:'Bearer '+this.token}});
    if (r.status===401){ this.expired(); throw new Error('expired'); }
    if (!r.ok){
      let reason='', msg='';
      try{ const j=await r.json(); reason=(j.error && (j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason || j.error.status)) || ''; msg=(j.error&&j.error.message)||''; }catch(e){}
      const err=new Error('http'+r.status); err.status=r.status; err.reason=reason; err.detail=msg; throw err;
    }

  },
  expired(){ if(!this.token) return; this.token=null; updateStatus(); toast('החיבור ל-Google פג. השינויים יישמרו בדרייב אחרי התחברות מחדש.',[{label:'התחברות מחדש',fn:driveReauth}]); },

  },

    if (!this.canEdit) return null;
    return (await this.api('files?supportsAllDrives=true&fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name, mimeType:GFOLDER_MIME, parents:[parent]})})).id;
  },
  async readJSON(id){ const r=await this.api(`files/${id}?alt=media&supportsAllDrives=true`,{},true); return JSON.parse(await r.text()); },
  async open(folderId){

    if (meta.mimeType!==GFOLDER_MIME) throw new Error('notfolder');

    const read=async (path,f)=>{ if(!f) return null; this.ids[path]=f.id; this.mod[path]=f.modifiedTime; try{ return await this.readJSON(f.id); }catch(e){ return null; } };
    const cd=await read('categories.json',get('categories.json')), sd=await read('settings.json',get('settings.json'));
    const months={};
    if (this.txId){
      const tf=await this.list(this.txId);

    }

      else {
        const parent=path.startsWith('transactions/')?this.txId:this.projId, bd='mmb'+Date.now();
        const mp=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:path.split('/').pop(), parents:[parent], mimeType:'application/json'})}\r\n--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${body}\r\n--${bd}--`;
        r=await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true&fields=id,modifiedTime',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp});
        this.ids[path]=r.id;
      }
      this.mod[path]=r.modifiedTime; this.failed.delete(path);
    }catch(e){
      if (e.message==='expired'){ this.failed.add(path); return; }
      const rate = e.status===429 || e.status>=500 || /rateLimit|userRateLimit|backendError/i.test(e.reason||'');
      if (e.status===404 && this.ids[path] && attempt<1){ delete this.ids[path]; return this.writeNow(path,obj,attempt+1); }
      if (rate && attempt<4){ await new Promise(r=>setTimeout(r,(2**attempt)*1000+Math.random()*500)); return this.writeNow(path,obj,attempt+1); }
      this.failed.add(path);
      this.reportFail(e);
    }
  },
  reportFail(e){
    const now=Date.now(); if (this._lastFail && now-this._lastFail<4000) return; this._lastFail=now;
    const r=e.reason||'', d=e.detail||'';
    let msg;
    if (/insufficientPermissions|SCOPE_INSUFFICIENT|insufficient/i.test(r+d)) msg='לא אושרה הרשאת עריכה לדרייב בזמן ההתחברות. התנתקו, התחברו שוב, ובחלון של Google סמנו את תיבת ההרשאה לדרייב.';
    else if (/storageQuota/i.test(r)) msg='אין מספיק מקום פנוי ב-Google Drive.';
    else if (/forbidden|cannotAddParent|teamDrive|appNotAuthorized/i.test(r) || e.status===403) msg=`Google חסמה את השמירה (${r||e.status}). ודאו שיש לחשבון הרשאת "עורך" לתיקייה.`;
    else msg=`השמירה ל-Google Drive נכשלה (${e.status||''} ${r}${d?': '+d.slice(0,120):''}).`;
    toast(msg,[{label:'לנסות שוב',fn:()=>this.retryFailed()}]);
  },
  retryFailed(){ const f=[...(this.failed||[])]; this.failed=new Set(); f.forEach(p=>{ const g=this.getters&&this.getters[p]; if(g) this.queue(p,g); }); if(!f.length) toast('אין שמירות שממתינות'); },
  saveSettings(){
    this.queue('categories.json',()=>({updated:new Date().toISOString(), categories:S.settings.categories, learned:S.settings.learned||{}}));
    this.queue('settings.json',()=>{ const {categories,learned,...rest}=S.settings; return rest; });
  },
  saveMonth(k){ this.queue('transactions/'+k+'.json',()=>({month:k, items:S.months[k]||[]})); },
  saveAll(){ this.saveSettings(); Object.keys(S.months).forEach(k=>this.saveMonth(k)); },
  async changedRemotely(){
    const a=(await this.list(this.projId)).filter(f=>/\.json$/.test(f.name));
    const b=this.txId ? (await this.list(this.txId)).filter(f=>/\.json$/.test(f.name)).map(f=>({...f, name:'transactions/'+f.name})) : [];
    return a.concat(b).some(f=> !this.mod[f.name] || f.modifiedTime>this.mod[f.name]);
  },
  async download(f){
    const r=await this.api(f.mimeType===GSHEET_MIME ? `files/${f.id}/export?mimeType=${this.q('application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')}` : `files/${f.id}?alt=media&supportsAllDrives=true`,{},true);
    return r.arrayBuffer();
  }
};
function parseFolderId(s){ s=String(s||'').trim(); const m=s.match(/folders\/([\w-]{10,})/)||s.match(/[?&]id=([\w-]{10,})/); return m?m[1]:(/^[\w-]{10,}$/.test(s)?s:''); }
function driveErr(e){
  const m=e && e.message || '';
  if (m==='scope') return 'לא סומנה בחלון של Google ההרשאה לגשת לדרייב. התחברו שוב וסמנו את תיבת ההרשאה.';
  if (m==='nolib') return 'ספריית ההתחברות של Google לא נטענה. בדקו חיבור לאינטרנט ורעננו את העמוד.';
  if (m==='popup_closed' || m==='popup_failed_to_open') return 'חלון ההתחברות של Google נסגר או נחסם. אפשרו חלונות קופצים ונסו שוב.';
  if (m==='access_denied') return 'ההתחברות בוטלה, או שהחשבון לא נוסף כמשתמש בדיקה בהגדרות הפרויקט ב-Google Cloud.';
  if (m==='notfolder') return 'הקישור לא מוביל לתיקייה בדרייב.';
  if (m==='http404') return 'התיקייה לא נמצאה, או שאין לחשבון הזה גישה אליה. בקשו מבעל התיקייה לשתף אותה איתכם.';
  if (m==='http403') return 'אין הרשאה. ודאו ש-Google Drive API מופעל בפרויקט ושהתיקייה משותפת עם החשבון.';
  return 'החיבור ל-Google Drive נכשל ('+m+').';
}

function normalizeSettings(s){
  s = s || {};
  if (!Array.isArray(s.categories) || !s.categories.length) s.categories = JSON.parse(JSON.stringify(DEFAULT_CATS));
  s.learned ||= {}; s.cards ||= [];
  DEFAULT_CATS.forEach(d=>{ if(!s.categories.some(c=>c.id===d.id)) s.categories.push(JSON.parse(JSON.stringify(d))); });
  return s;
}
function mergeData(base, extra){
  // union by id: folder data wins, anything only in the browser is kept
  const s=normalizeSettings(base.settings), x=extra.settings||{};
  (x.categories||[]).forEach(c=>{ if(!s.categories.some(y=>y.id===c.id)) s.categories.push(c); });
  (x.cards||[]).forEach(c=>{ if(!s.cards.some(y=>y.id===c.id)) s.cards.push(c); });
  ['learned','importProfiles','importedFiles'].forEach(k=>{ s[k]={...(x[k]||{}), ...(s[k]||{})}; });
  const months={...base.months};
  Object.entries(extra.months||{}).forEach(([k,items])=>{ const have=new Set((months[k]||[]).map(t=>t.id)); const add=items.filter(t=>!have.has(t.id)); if(add.length) months[k]=(months[k]||[]).concat(add).sort((a,b)=>b.date.localeCompare(a.date)); });
  return {settings:s, months};
}

  async run(mode,fn){ try{ const db=await this.open(); return await new Promise((res,rej)=>{ const tx=db.transaction('kv',mode); const q=fn(tx.objectStore('kv')); tx.oncomplete=()=>res(q&&q.result); tx.onerror=()=>rej(tx.error); }); }catch(e){ return null; } },

async function collectDir(handle, prefix='', depth=0, out=[]){
  for await (const [name,hd] of handle.entries()){
    if (hd.kind==='file' && isSheet(name)) out.push({file:await hd.getFile(), path:prefix+name});
    else if (hd.kind==='directory' && depth<2) await collectDir(hd, prefix+name+'/', depth+1, out);
  }
  return out;
}
async function scanFolder(interactive){
  if (!dirHandle) return;
  let perm='prompt'; try{ perm=await dirHandle.queryPermission({mode:'read'}); if(perm!=='granted' && interactive) perm=await dirHandle.requestPermission({mode:'read'}); }catch(e){}
  if (perm!=='granted'){
    if (interactive) toast('אין הרשאה לקרוא את התיקייה.');
    else toast(`התיקייה "${dirHandle.name}" מקושרת.`,[{label:'בדיקת קבצים חדשים',fn:()=>scanFolder(true)}]);
    return;
  }
  try{ await queueFiles(await collectDir(dirHandle), interactive); }
  catch(e){ toast('לא הצלחתי לקרוא את התיקייה. ייתכן שהיא הועברה או נמחקה. קשרו אותה מחדש.'); }

async function queueFiles(items, interactive){
  const done=S.settings.importedFiles||{};
  const fresh=items.filter(it=>!done[fileKey(it.path,it.file)]).sort((a,b)=>a.file.lastModified-b.file.lastModified);
  S.settings.lastScan=new Date().toISOString(); Store.saveSettings();
  if (!fresh.length){ if(interactive) toast('אין קבצים חדשים בתיקייה.'); if(S.tab==='import' && !S.imp) renderImport(); return; }
  S.queue=fresh; S.batch={files:0, tx:0, uncat:0, months:new Set()};
  await processQueue(interactive);
}
async function processQueue(interactive){
  while (S.queue.length){
    const it=S.queue.shift(); let rows;
    try{ rows=await readFile(it.file); }catch(e){ markFile(it); continue; }
    if (rows.length<2){ markFile(it); continue; }
    const prof=findProfile(rows), fcard=cardFromName(it.file.name);
    if (prof){
      S.imp={name:it.file.displayName||it.file.name, path:it.path, mime:it.file.mime||null, rows, map:prof.map, cardName:fcard||prof.cardName||'', item:it};
      const b=buildImport(); commitImport(b.out,b.fills); markFile(it); continue;
    }
    S.imp={name:it.file.displayName||it.file.name, path:it.path, mime:it.file.mime||null, rows, map:autoKind(guessMap(rows), it.file.displayName||it.file.name), cardName:fcard, item:it};
    if (interactive || S.tab==='import'){ S.tab='import'; render(); }
    else toast(`בתיקייה יש קובץ חדש בפורמט שעוד לא הוגדר: ${it.file.name}`,[{label:'להגדרה',fn:()=>{ S.tab='import'; render(); }}]);

}

/* ---------- savings ---------- */
function analysis(){
  let winList, nM, cur, P, pN, hasPrev, spanList, window3;
  if (S.range){
    winList=periodTx(); window3=periodMonths().filter(m=>monthTx(m).length);
    nM=periodLenMonths(); cur=totals(winList);
    const days=Math.round((new Date(S.range.to)-new Date(S.range.from))/864e5)+1;
    const pTo=new Date(new Date(S.range.from).getTime()-864e5), pFrom=new Date(pTo.getTime()-(days-1)*864e5);
    const iso=d=>d.toISOString().slice(0,10), pf=iso(pFrom), pt=iso(pTo);
    const prevList=allTx().filter(t=>t.date>=pf && t.date<=pt);
    P=totals(prevList); pN=1; hasPrev=prevList.length>0;
    // compare whole periods: scale current to the same basis
    spanList=window3;
  } else {
    const k=S.month, prev=[shiftMonth(k,-1),shiftMonth(k,-2),shiftMonth(k,-3)];
    window3=[k,prev[0],prev[1]].filter(m=>monthTx(m).length);
    nM=Math.max(1,window3.length); winList=window3.flatMap(monthTx);
    cur=totals(monthTx(k));
    const prevMonths=prev.filter(m=>monthTx(m).length);
    P=totals(prevMonths.flatMap(monthTx)); pN=Math.max(1,prevMonths.length); hasPrev=prevMonths.length>0;
    spanList=[k,...prev].filter(m=>monthTx(m).length);
  }
  const W=totals(winList);
  const avg = v => v/nM;

  const flexible = Object.entries(W.byCat).map(([id,v])=>({c:catById(id), avg:avg(v)}))
    .filter(x=>x.c.nec!=='essential' && x.c.id!=='uncat').sort((a,b)=>b.avg-a.avg);

  // recurring: same normalized description in >=2 months of last 3-4, similar amount
  const span=spanList;
  const byDesc={};
  span.forEach(m=>monthTx(m).filter(t=>!S.range||inRange(t.date)).filter(t=>t.type==='expense' && !t.inst && !t.excluded).forEach(t=>{ const d=norm(t.desc).replace(/\d+/g,'').trim(); ((byDesc[d] ||= {desc:t.desc,months:{},catId:t.catId}).months[m] ||= []).push(t.amount); }));
  const recurring = Object.values(byDesc).map(x=>{ const ms=Object.keys(x.months); if(ms.length<2) return null;
      const per=ms.map(m=>x.months[m].reduce((a,b)=>a+b,0)); const mean=per.reduce((a,b)=>a+b,0)/per.length;
      const stable=per.every(v=>Math.abs(v-mean)<=Math.max(15,mean*0.2)); const cnt=ms.map(m=>x.months[m].length);
      if(!stable || Math.max(...cnt)>3) return null; return {desc:x.desc, monthly:mean, n:ms.length, cat:catById(x.catId)}; })
    .filter(Boolean).filter(x=>x.cat.nec!=='essential' || x.cat.id==='insurance' || x.cat.id==='phone').sort((a,b)=>b.monthly-a.monthly).slice(0,12);

  // small frequent purchases this window
  const smallG={};
  winList.filter(t=>!t.excluded && t.type==='expense' && t.amount<=60 && necOf(t)!=='essential').forEach(t=>{ const g=(smallG[t.catId] ||= {c:catById(t.catId),n:0,sum:0}); g.n++; g.sum+=t.amount; });
  const small=Object.values(smallG).filter(g=>g.n>=4).map(g=>({...g, n:g.n/nM, sum:g.sum/nM})).sort((a,b)=>b.sum-a.sum);

  // rises vs previous months
  const rises = hasPrev? Object.entries(cur.byCat).map(([id,v])=>{ const p=(P.byCat[id]||0)/pN; return {c:catById(id), cur:v, prev:p, diff:v-p}; })
    .filter(x=>x.diff>=150 && x.cur>x.prev*1.25 && x.c.id!=='uncat').sort((a,b)=>b.diff-a.diff).slice(0,6) : [];

  return {nM, W, avg, cur, flexible, recurring, small, rises, months:window3};
}

  const A=analysis();
  if (!A.months.length){ app.innerHTML=`<div class="panel empty"><strong>אין עדיין נתונים לניתוח</strong>הוסיפו או ייבאו תנועות, ואז נראה כאן איפה אפשר לצמצם.<div style="margin-top:16px"><button class="btn primary" data-act="goimport">ייבוא מקובץ</button></div></div>`; bindCommon(); return; }
  const optAvg=A.avg(A.W.optional), impAvg=A.avg(A.W.important), expAvg=A.avg(A.W.exp), incAvg=A.avg(A.W.inc);
  const potential = optAvg*S.cut/100 + impAvg*Math.min(S.cut,15)/100;
  const savingRate = incAvg? (incAvg-expAvg)/incAvg*100 : null;
  app.innerHTML = `
  <div class="panel" style="margin-bottom:18px">
    <p class="muted" style="margin-top:0">${S.range?`מבוסס על התקופה ${periodLabel()}, בחישוב חודשי.`:`מבוסס על ממוצע ${A.nM===1?'החודש הנוכחי':A.nM+' החודשים האחרונים'} עד ${monthLabel(S.month)}.`} בממוצע ${fmt(expAvg)} בחודש הוצאות, מתוכן ${fmt(optAvg)} רשות (${expAvg?Math.round(optAvg/expAvg*100):0}%)${savingRate!==null?` · שיעור החיסכון שלכם: ${Math.round(savingRate)}%`:''}.</p>
    <div class="sav-hero">
      <div><div class="sav-num" id="savNum">${fmt(potential)}</div><div class="muted">חיסכון אפשרי בחודש · <strong id="savYear">${fmt(potential*12)}</strong> בשנה</div></div>
      <div>
        <div class="slider-row"><label for="cut">צמצום הוצאות רשות</label><input type="range" id="cut" min="5" max="60" step="5" value="${S.cut}"><strong id="cutVal">${S.cut}%</strong></div>
        <div class="muted" style="font-size:.88rem">ועוד עד 15% מהוצאות "חשוב" דרך מעבר לספקים זולים יותר</div>
      </div>
    </div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>ההוצאות הגמישות הגדולות</h2>
      ${A.flexible.length?`<ul class="sav-list">${A.flexible.slice(0,7).map(x=>`<li><span>${esc(x.c.name)} ${badge(x.c.nec)}</span><span class="amt">${fmt(x.avg)} לחודש</span>
        <span class="tip">צמצום של ${x.c.nec==='optional'?'25':'10'}% חוסך כ-${fmt(x.avg*(x.c.nec==='optional'?.25:.10)*12)} בשנה. ${esc(TIPS[x.c.id]||'')}</span></li>`).join('')}</ul>`:'<p class="muted">כל ההוצאות מסווגות כחובה.</p>'}
    </div>
    <div class="panel"><h2>חיובים קבועים לבדיקה</h2>
      <p class="muted" style="margin-top:-6px;font-size:.9rem">חיובים שחוזרים כל חודש בסכום דומה. לכל אחד שאלו: אני עדיין צריך את זה? אפשר לשלם פחות?</p>
      ${A.recurring.length?`<ul class="sav-list">${A.recurring.map((r,ri)=>`<li><span><button class="desc-btn" data-rhist="${ri}" title="כל העסקאות בבית העסק">${esc(r.desc)}</button> <button class="cat-btn" data-rec="${ri}" style="font-weight:400;padding:0 2px">· ${esc(r.cat.name)} ▾</button></span><span class="amt">${fmt(r.monthly)} · ${fmt(r.monthly*12)} בשנה</span></li>`).join('')}</ul>`
        :`<p class="muted">${A.nM<2?'צריך לפחות חודשיים של נתונים כדי לזהות חיובים חוזרים.':'לא זוהו חיובים חוזרים שאינם חובה.'}</p>`}
    </div>
    <div class="panel"><h2>הוצאות קטנות שמצטברות</h2>
      ${A.small.length?`<ul class="sav-list">${A.small.map(g=>`<li><span>${esc(g.c.name)}</span><span class="amt">${fmt(g.sum)} לחודש</span><span class="tip">כ-${Math.round(g.n)} רכישות של עד ₪60 בחודש. ${fmt(g.sum*12)} בשנה.</span></li>`).join('')}</ul>`:'<p class="muted">אין דפוס בולט של רכישות קטנות ותכופות.</p>'}
    </div>
    <div class="panel"><h2>${S.range?'מה עלה לעומת התקופה הקודמת':'מה עלה ב'+monthName(S.month)}</h2>
      ${A.rises.length?`<ul class="sav-list">${A.rises.map(r=>`<li><span>${esc(r.c.name)}</span><span class="amt" style="color:var(--exp)">+${fmt(r.diff)}</span><span class="tip">${fmt(r.cur)} ${S.range?'בתקופה לעומת '+fmt(r.prev)+' בתקופה המקבילה שלפניה.':'החודש לעומת ממוצע של '+fmt(r.prev)+' בחודשים הקודמים.'}</span></li>`).join('')}</ul>`
        :`<p class="muted">${A.nM<2?'צריך חודש קודם להשוואה.':'אין קפיצות משמעותיות לעומת החודשים הקודמים.'}</p>`}
    </div>
    ${(()=>{ const ending=plans().map(p=>({p,s:planAt(p,refMonth())})).filter(x=>x.s.active && x.s.left<=3).sort((a,b)=>a.p.end.localeCompare(b.p.end));
      const committed=plans().reduce((a,p)=>{ const s=planAt(p,refMonth()); return a+(s.left>0?p.amount:0); },0);
      return committed?`<div class="panel"><h2>תשלומים פתוחים</h2>
        <p style="margin-top:0">בחודש הבא כבר מחויבים <strong>${fmt(nextLoad())}</strong> על עסקאות בתשלומים${incAvg?`, ${Math.round(nextLoad()/incAvg*100)}% מההכנסה החודשית`:''}. לפני עסקה חדשה בתשלומים, בדקו כמה היא מוסיפה לסכום הזה.</p>
        ${ending.length?`<ul class="sav-list">${ending.map(x=>`<li><span>${esc(x.p.desc)}</span><span class="amt" style="color:var(--inc)">${fmt(x.p.amount)} יתפנו</span><span class="tip">התשלום האחרון ב${monthLabel(x.p.end)}. כדאי להעביר את הסכום שמתפנה לחיסכון במקום לעסקה חדשה.</span></li>`).join('')}</ul>`:''}</div>`:''; })()}
  </div>
  <div class="panel" style="margin-top:18px" id="aiPanel" hidden>
    <h2>תוכנית חיסכון אישית מ-Claude</h2>
    <p class="muted" style="margin-top:0">Claude יקבל סיכום של הסכומים לפי קטגוריה והחיובים הקבועים (בלי פרטי חשבון) ויציע צעדים מעשיים.</p>
    <button class="btn primary" id="aiGo">קבלת המלצות</button>
    <div class="ai-out" id="aiOut"></div>
  </div>
  <div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="expBtn" hidden>ייצוא כל התנועות ל-CSV</button></div>`;
  const cut=app.querySelector('#cut');
  cut.oninput=()=>{ S.cut=+cut.value; const p=optAvg*S.cut/100+impAvg*Math.min(S.cut,15)/100; app.querySelector('#cutVal').textContent=S.cut+'%'; app.querySelector('#savNum').textContent=fmt(p); app.querySelector('#savYear').textContent=fmt(p*12); };
  app.querySelectorAll('[data-rhist]').forEach(b=>b.onclick=()=>openMerchant(A.recurring[+b.dataset.rhist].desc,'expense'));
  app.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>{ const r=A.recurring[+b.dataset.rec]; const txs=sameNameTx(r.desc,'expense',[]); if(txs.length) pickForTx(txs,{groupLabel:`כל ${txs.length} החיובים בשם הזה`}); });
  setupAI(A); setupExport();
}
let sampleNs=null, downloadsNs=null;
function setupAI(A){
  const panel=app.querySelector('#aiPanel'); if(!sampleNs) return; panel.hidden=false;
  const btn=app.querySelector('#aiGo'), out=app.querySelector('#aiOut');
  btn.onclick=async()=>{
    btn.disabled=true; out.textContent='חושב…';
    const lines = Object.entries(A.W.byCat).sort((a,b)=>b[1]-a[1]).map(([id,v])=>{ const c=catById(id); return `${c.name} (${NEC[c.nec].label}): ${Math.round(A.avg(v))} ₪ לחודש`; });
    const prompt = `אתה יועץ כלכלי למשק בית בישראל. ענה בעברית, בגוף שני, בטון חם וענייני, בלי כותרות markdown ובלי כוכביות.
נתוני ממוצע חודשי (${A.nM} חודשים):
הכנסות: ${Math.round(A.avg(A.W.inc))} ₪. הוצאות: ${Math.round(A.avg(A.W.exp))} ₪ (חובה ${Math.round(A.avg(A.W.essential))}, חשוב ${Math.round(A.avg(A.W.important))}, רשות ${Math.round(A.avg(A.W.optional))}).
לפי קטגוריה:
${lines.join('\n')}
תשלומים פתוחים: בחודש הבא ${Math.round(nextLoad())} ₪ מחויבים על עסקאות בתשלומים.
חיובים קבועים: ${A.recurring.map(r=>r.desc+' '+Math.round(r.monthly)+' ₪').join('; ')||'לא זוהו'}
כתוב 5 עד 7 צעדים ממוספרים, מסודרים לפי גובה החיסכון. לכל צעד: מה לעשות בפועל, וכמה בערך אפשר לחסוך בחודש. אל תמליץ לקצץ בהוצאות חובה בסיסיות; כן אפשר להציע לשלם עליהן פחות. סיים במשפט אחד על יעד חיסכון חודשי ריאלי.`;
    try{ await sampleNs(prompt,{modelTier:'default', onText:({text})=>{ out.textContent=text; }}); }
    catch(e){ out.textContent = e.code==='not_granted'?'אין הרשאה לשאול את Claude מהעמוד הזה.': e.code==='rate_limited'?'יותר מדי בקשות. נסו שוב בעוד דקה.':'לא התקבלה תשובה. נסו שוב.'; }
    btn.disabled=false; btn.textContent='המלצות מחדש';
  };
}
function setupExport(){
  const b=app.querySelector('#expBtn'); if(!downloadsNs || !allTx().length) return; b.hidden=false;
  b.onclick=async()=>{
    const rows=[['תאריך','תיאור','סוג','סכום','קטגוריה','נושא','רמת הכרח','כרטיס','תשלום','סכום עסקה','בדוחות','הערה']];
    allTx().sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{ const c=catById(t.catId); rows.push([t.date,t.desc,t.type==='income'?'הכנסה':'הוצאה',t.amount,c.name,c.topic,t.type==='income'?'':NEC[necOf(t)].label,cardName(t.card),t.inst?t.inst.n+'/'+t.inst.of:'',t.inst&&t.inst.total||'',t.excluded?'לא':'כן',t.note||'']); });
    const csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    try{ await downloadsNs.save({filename:'tnuot-'+todayISO()+'.csv', data:new Blob([csv],{type:'text/csv;charset=utf-8'})}); }catch(e){ if(e.code!=='cancelled' && e.code!=='declined') toast('הייצוא לא הושלם.'); }
  };
}

/* ================= boot ================= */
(async()=>{
  const data = await Store.init();
  S.settings = normalizeSettings(data.settings);
  S.months = data.months;
  const keys=monthKeys(); S.month = keys.length? keys[keys.length-1] : todayISO().slice(0,7);
  try{ const hp=new URLSearchParams(location.hash.slice(1)); if(hp.get('gclient')) localStorage.setItem('mm-gclient',hp.get('gclient')); if(hp.get('gfolder')) localStorage.setItem('mm-gfolder',parseFolderId(hp.get('gfolder'))); if(hp.get('gclient')||hp.get('gfolder')) history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  updateStatus();
  if (!data.settings) Store.saveSettings();
  if (FS_API){
    const ph=await IDB.get('proj');
    if (ph){
      let perm='prompt'; try{ perm=await ph.queryPermission({mode:'readwrite'}); }catch(e){}
      if (perm==='granted') await activateProj(ph,false);
      else { PROJ.parentName=(await IDB.get('projParent'))||''; document.getElementById('projBanner').innerHTML=`<div class="panel" style="margin:10px 0 0;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-color:var(--accent)"><span>הנתונים שלך שמורים בתיקייה ${esc(PROJ.parentName?PROJ.parentName+'/':'')}project_data. הדפדפן מבקש אישור לגשת אליה.</span><button class="btn primary small" id="projGrant">טעינת הנתונים מהתיקייה</button></div>`; document.getElementById('projGrant').onclick=reconnectProj; }
    }
  }
  if (GD.available() && GD.clientId() && GD.folderId()){
    document.getElementById('projBanner').innerHTML=`<div class="panel" style="margin:10px 0 0;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-color:var(--accent)"><span>הנתונים המשותפים שמורים ב-Google Drive.</span><button class="btn primary small" id="gdBanner">התחברות עם Google</button></div>`;
    document.getElementById('gdBanner').onclick=driveConnect;
  }
  render();
  if (FS_API){ dirHandle = await IDB.get('dir'); if (dirHandle){ if(S.tab==='import' && !S.imp) renderImport(); scanFolder(false); } }
  if (window.claude && typeof window.claude.use==='function'){
    claude.use('sample').then(s=>{ sampleNs=s; if(S.tab==='save') render(); }).catch(()=>{});
    claude.use('downloads').then(d=>{ downloadsNs=d; if(S.tab==='save') render(); }).catch(()=>{});
  }
})();
})();
</script>
</body>
