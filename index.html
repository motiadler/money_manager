<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#D3E0EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="תזרים">
<meta name="application-name" content="תזרים">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>תזרים · ניהול הכנסות והוצאות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --sunk:#EEF1F7; --ink:#111827; --muted:#6B7280; --line:#E5E8EF;
  --accent:#4F46E5; --accent-soft:#EEF0FF; --accent-ink:#FFFFFF;
  --ess:#3B82F6; --imp:#F59E0B; --opt:#EC4899; --inc:#059669; --exp:#E11D48;
  --inc-soft:#E7F7F0; --exp-soft:#FDECEF; --imp-soft:#FFF5E0;
  --radius-s:10px; --radius-l:18px;
  --shadow:0 1px 2px rgba(17,24,39,.04), 0 8px 24px -14px rgba(17,24,39,.18);
  --serif:"Rubik", "Heebo", "Segoe UI", Arial, sans-serif;
  --sans:"Rubik", "Heebo", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1120; --surface:#131B2E; --sunk:#1B2540; --ink:#E8ECF5; --muted:#94A0B8; --line:#243050;
    --accent:#818CF8; --accent-soft:#1E2550; --accent-ink:#0B1120;
    --ess:#60A5FA; --imp:#FBBF24; --opt:#F472B6; --inc:#34D399; --exp:#FB7185;
    --inc-soft:#0F2A24; --exp-soft:#33141D; --imp-soft:#2E2410;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1120; --surface:#131B2E; --sunk:#1B2540; --ink:#E8ECF5; --muted:#94A0B8; --line:#243050;
  --accent:#818CF8; --accent-soft:#1E2550; --accent-ink:#0B1120;
  --ess:#60A5FA; --imp:#FBBF24; --opt:#F472B6; --inc:#34D399; --exp:#FB7185;
  --inc-soft:#0F2A24; --exp-soft:#33141D; --imp-soft:#2E2410;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.6);
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px 90px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between;
  margin:0 -20px;padding:14px 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.3rem;margin:0;letter-spacing:-.01em}
.brand::before{content:"💰";display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);font-size:1.25rem}
.brand small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.month-ctl{display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.month-ctl button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;color:var(--muted)}
.month-ctl button:hover{background:var(--sunk);color:var(--ink)}
.month-ctl select{border:0;background:transparent;font-weight:600;padding:4px 6px;min-width:130px;text-align:center}
.month-ctl input[type=date]{border:1px solid var(--line)!important;border-radius:8px!important}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:500;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 6px 16px -8px var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.small{padding:5px 11px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* tabs */
nav.tabs{display:flex;gap:6px;margin:6px 0 22px;overflow-x:auto;padding:5px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;padding:9px 14px;cursor:pointer;font-weight:500;color:var(--muted);border-radius:11px;white-space:nowrap;display:flex;gap:7px;align-items:center;transition:background .15s,color .15s}
nav.tabs button:hover{color:var(--ink);background:var(--sunk)}
nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
.status{font-size:.8rem;color:var(--muted);margin:2px 0 8px;display:flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--inc);flex:none}
[hidden]{display:none!important}
h2{font-weight:600;font-size:1.12rem;margin:0 0 12px;letter-spacing:-.005em}
h3{font-size:1rem;font-weight:600;margin:0 0 8px}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid transparent;border-radius:var(--radius-l);padding:20px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.stack>*+*{margin-top:18px}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border-radius:var(--radius-l);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:.86rem}
.kpi-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:1rem;flex:none}
.kpi-val{font-size:clamp(1.25rem,2.4vw,1.65rem);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-delta{font-size:.8rem;font-weight:500}
.delta-good{color:var(--inc)} .delta-bad{color:var(--exp)} .delta-flat{color:var(--muted)}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}

/* hero */
.hero{padding:4px 0 20px}
.hero.panel{padding:20px;margin-bottom:18px}
.hero-line{font-weight:600;font-size:clamp(1.15rem,2.4vw,1.5rem);line-height:1.4;margin:0;max-width:40ch}
.hero-line b{font-weight:700}
.hero-line .inc{color:var(--inc)} .hero-line .exp{color:var(--exp)}
.hero-net{margin-top:6px;font-size:.98rem}
.ledger{margin-top:18px}
.ledger-bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--sunk);gap:3px}
.ledger-bar span{display:block;height:100%;border-radius:999px;transition:width .5s}
.seg-ess{background:var(--ess)} .seg-imp{background:var(--imp)} .seg-opt{background:var(--opt)}
.ledger-legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px}
.legend-item{display:flex;align-items:baseline;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;transform:translateY(1px)}
.legend-item strong{font-size:1.05rem;font-weight:600}

/* bars */
.hbars{list-style:none;margin:0;padding:0}
.hbars li{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:12px;align-items:center;padding:7px 8px;margin:0 -8px;cursor:pointer;border-radius:10px}
.hbars li:hover{background:var(--sunk)}
.hb-track{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden;display:flex}
.hb-track span{height:100%}
.hb-val{font-variant-numeric:tabular-nums;font-weight:600;min-width:70px;text-align:left}
.trend svg{width:100%;height:auto;display:block}
.trend text{font-family:var(--sans);font-size:11px;fill:var(--muted)}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--sunk)}
.b-ess{color:var(--ess);background:color-mix(in srgb,var(--ess) 12%,transparent)} .b-imp{color:var(--imp);background:var(--imp-soft)} .b-opt{color:var(--opt);background:color-mix(in srgb,var(--opt) 12%,transparent)} .b-inc{color:var(--inc);background:var(--inc-soft)}

/* inputs */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input,.filters select,.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;transition:border-color .15s,box-shadow .15s}
.filters input:focus,.filters select:focus,.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.filters input[type=search]{flex:1;min-width:180px}

/* tables */
.table-wrap{overflow-x:auto;border-radius:var(--radius-l);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:500;color:var(--muted);font-size:.8rem;background:var(--surface);position:sticky;top:0;z-index:1}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.amt{font-variant-numeric:tabular-nums;font-weight:600;text-align:left;white-space:nowrap}
td.amt.inc{color:var(--inc)}
td select{border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:8px;max-width:180px}
td select:hover,td select:focus{border-color:var(--line);background:var(--surface)}
.uncat select{color:var(--exp);font-weight:600}
.row-actions{white-space:nowrap}
.icon-btn{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:6px 8px;border-radius:8px}
.icon-btn:hover{color:var(--ink);background:var(--sunk)}
.cat-btn{border:0;background:var(--sunk);padding:4px 10px;border-radius:999px;cursor:pointer;text-align:right;font-weight:500;font-size:.88rem;white-space:nowrap}
.cat-btn:hover,.cat-btn:focus-visible{background:var(--accent-soft);color:var(--accent)}
.cat-btn.is-uncat{color:var(--exp);background:var(--exp-soft)}
.desc-btn{border:0;background:transparent;padding:0;cursor:pointer;text-align:right;font:inherit;color:inherit;font-weight:500}
.desc-btn:hover{color:var(--accent)}
.click-row{cursor:pointer}.click-row:hover{background:var(--sunk)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--sunk);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.hist-btn{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:2px 5px;border-radius:6px;font-size:.85rem}
.hist-btn:hover{color:var(--ink);background:var(--sunk)}
.is-excl td{opacity:.45}.is-excl td.amt{text-decoration:line-through}.is-excl td:has(input[data-incl]),.is-excl td:has(input[data-mincl]),.is-excl td:has(input[data-pincl]){opacity:1}
.issue-row td{font-size:.88rem}
.link-tag{border:0;border-radius:999px;padding:1px 9px;font:inherit;font-size:.78rem;font-weight:500;cursor:default;display:inline-block}
button.link-tag{cursor:pointer}
.link-tag.ok{background:var(--inc-soft);color:var(--inc)}
.link-tag.pend{background:var(--accent-soft);color:var(--accent)}
.link-tag.warn{background:var(--imp-soft);color:color-mix(in srgb,var(--imp) 75%,var(--ink))}
#lockScreen{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px;background:var(--bg);overflow:auto}
#lockScreen *{box-sizing:border-box}
.lock-card{width:min(380px,100%);background:var(--surface);border-radius:28px;padding:28px 22px;box-shadow:var(--shadow);text-align:center}
.lock-logo{width:72px;height:72px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:2rem;color:#fff;background:radial-gradient(circle at 35% 30%,#8FC5B2,var(--sage,#4E8F79) 60%,#2F6553);box-shadow:0 0 0 4px color-mix(in srgb,var(--sage,#4E8F79) 30%,transparent)}
.lock-or{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--muted);font-size:.86rem}.lock-or::before,.lock-or::after{content:"";flex:1;height:1px;background:var(--line)}
.cat-item{border-bottom:1px solid var(--line)}
.cat-item summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 4px;cursor:pointer}
.cat-item summary::-webkit-details-marker{display:none}
.ci-name{flex:1;font-weight:500}
.ci-amt{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ci-amt small{color:var(--muted);font-weight:400}
.ci-amt.over{color:var(--exp)}
.ci-chev{color:var(--muted);transition:transform .2s;font-size:1.2rem}
.cat-item[open] .ci-chev{transform:rotate(-90deg)}
.cat-item[open] summary{color:var(--accent)}
.cat-item .cat-row{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));padding:4px 4px 14px;align-items:end}
.cat-item .cat-row .kw{grid-column:1/-1}
.upd{display:flex;align-items:center;gap:10px;margin:10px 0 4px;padding:12px 14px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);border:2px solid var(--accent)}
.upd-ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);font-size:1.1rem;flex:none}
.by-tag{display:inline-block;font-size:.74rem;font-weight:600;color:var(--sand,#C3913B);background:var(--sand-soft,#F3E6C9);border-radius:999px;padding:1px 8px;margin-inline-start:6px;white-space:nowrap}
button.inst-tag{border:0;cursor:pointer;font-family:inherit}
.ins-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.ins{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);border-inline-start:5px solid var(--tone)}
.ins-ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--tone-soft);font-size:1.2rem;flex:none}
.ins-title{font-family:var(--display);font-weight:600;font-size:1.02rem;line-height:1.3}
.ins-text{color:var(--muted);font-size:.9rem;margin-top:3px}
.shift-btn{border:1px dashed var(--inc);background:transparent;color:var(--inc);border-radius:999px;padding:0 8px;font:inherit;font-size:.74rem;font-weight:600;cursor:pointer;margin-inline-start:6px;white-space:nowrap}
.shift-btn:hover{background:var(--inc-soft)}
.inst-tag{display:inline-block;font-size:.74rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;margin-inline-start:6px;white-space:nowrap}
.prog{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden;min-width:90px}.prog span{display:block;height:100%;background:var(--accent);border-radius:999px}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;cursor:pointer}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
input[type=checkbox]{width:17px;height:17px}
.card-tag{font-size:.84rem;white-space:nowrap;color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.08rem;margin-bottom:6px;font-weight:600}
.empty::before{content:"🗂️";display:block;font-size:2rem;margin-bottom:8px}

/* forms & dialogs */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.82rem;font-weight:500;color:var(--muted)}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;cursor:pointer;font-weight:500;border-radius:9px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(17,24,39,.12);font-weight:600}
dialog{border:0;border-radius:22px;background:var(--surface);color:var(--ink);padding:24px;width:min(560px,94vw);box-shadow:0 30px 60px -20px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(15,23,42,.45);backdrop-filter:blur(3px)}
dialog h2{font-size:1.2rem}
.dlg-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:20px}

/* import */
.drop{border:2px dashed var(--line);border-radius:var(--radius-l);padding:38px 20px;text-align:center;background:var(--surface);cursor:pointer;transition:border-color .2s,background .2s}
.drop::before{content:"📥";display:block;font-size:2rem;margin-bottom:6px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{font-size:1.08rem;display:block;margin-bottom:4px;font-weight:600}
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}

/* categories */
.topic-block{margin-bottom:22px}
.topic-block h3{font-size:1rem;border-bottom:1px solid var(--line);padding-bottom:8px}
.cat-row{display:grid;grid-template-columns:minmax(140px,1.2fr) 120px 120px minmax(160px,2fr) auto;gap:8px;align-items:center;padding:6px 0}
.cat-row input,.cat-row select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 9px;width:100%}
@media (max-width:760px){.cat-row{grid-template-columns:1fr 1fr}.cat-row .kw{grid-column:1/-1}}

/* savings */
.sav-hero{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-end}
.sav-num{font-weight:700;font-size:clamp(2rem,5vw,2.8rem);line-height:1;color:var(--inc)}
.slider-row{display:flex;align-items:center;gap:12px;margin-top:10px}
.slider-row input[type=range]{width:220px}
.sav-list{list-style:none;margin:0;padding:0}
.sav-list li{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 16px}
.sav-list li:last-child{border-bottom:0}
.sav-list .tip{grid-column:1/-1;font-size:.9rem;color:var(--muted)}
.sav-list .amt{font-weight:600;font-variant-numeric:tabular-nums;text-align:left}
.ai-out{white-space:pre-wrap;line-height:1.75;margin-top:12px}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;display:flex;gap:12px;align-items:center;z-index:60;max-width:92vw;box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:3px 10px;cursor:pointer;font-weight:600}
.toast[hidden]{display:none}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
code{background:var(--sunk);padding:1px 6px;border-radius:6px;font-size:.88em}

/* bottom navigation (phones) */
.bnav{display:none}
.more-menu{position:fixed;z-index:45;bottom:calc(74px + env(safe-area-inset-bottom,0px));left:12px;right:12px;background:var(--surface);border-radius:18px;box-shadow:0 20px 50px -12px rgba(0,0,0,.35);padding:8px;display:grid;gap:2px}
.more-menu[hidden]{display:none}

/* ===== Wavez-inspired theme ===== */
:root{
  --bg:#D3E0EC; --surface:#FBF9F3; --sunk:#EDF1F4; --ink:#1E2C3A; --muted:#6B7C8B; --line:#E3E4DE;
  --accent:#3F6FA3; --accent-soft:#E2ECF6; --accent-ink:#FFFFFF;
  --sage:#4E8F79; --sage-soft:#DCEBE4; --sand:#C3913B; --sand-soft:#F3E6C9; --brick:#B2604F; --brick-soft:#F4E1DA;
  --ess:#4A7DB5; --imp:#C3913B; --opt:#B2604F; --inc:#3E8B6F; --exp:#B2604F;
  --inc-soft:#DCEBE4; --exp-soft:#F4E1DA; --imp-soft:#F3E6C9;
  --radius-s:14px; --radius-l:26px;
  --shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 2px 4px rgba(30,44,58,.05), 0 12px 26px -16px rgba(30,44,58,.35);
  --display:"Fredoka","Rubik","Segoe UI",Arial,sans-serif;
  --serif:var(--display);
  --sans:"Rubik","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1B28; --surface:#172636; --sunk:#1F3245; --ink:#E6EDF3; --muted:#93A5B5; --line:#26394C;
    --accent:#7FA7D6; --accent-soft:#1D3247; --accent-ink:#0F1B28;
    --sage:#6DB79B; --sage-soft:#173328; --sand:#DDB066; --sand-soft:#33291A; --brick:#D88675; --brick-soft:#36211C;
    --ess:#7FA7D6; --imp:#DDB066; --opt:#D88675; --inc:#6DB79B; --exp:#D88675;
    --inc-soft:#173328; --exp-soft:#36211C; --imp-soft:#33291A;
    --shadow:0 2px 4px rgba(0,0,0,.25), 0 14px 30px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1B28; --surface:#172636; --sunk:#1F3245; --ink:#E6EDF3; --muted:#93A5B5; --line:#26394C;
  --accent:#7FA7D6; --accent-soft:#1D3247; --accent-ink:#0F1B28;
  --sage:#6DB79B; --sage-soft:#173328; --sand:#DDB066; --sand-soft:#33291A; --brick:#D88675; --brick-soft:#36211C;
  --ess:#7FA7D6; --imp:#DDB066; --opt:#D88675; --inc:#6DB79B; --exp:#D88675;
  --inc-soft:#173328; --exp-soft:#36211C; --imp-soft:#33291A;
}
body{background:var(--bg) radial-gradient(1200px 500px at 50% -200px, color-mix(in srgb,#fff 35%,transparent), transparent)}
h1,h2,h3,.kpi-val,.sav-num,.stat b,.hero-line,.brand{font-family:var(--display)}
h2{font-weight:600;font-size:1.2rem}
.panel,.kpi,.table-wrap{border-radius:var(--radius-l);border:1px solid color-mix(in srgb,#fff 70%,transparent)}
.btn{border-radius:999px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 70%,#000 30%)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 70%,#000 30%)}
.brand::before{content:"₪";font-family:var(--display);font-weight:700;color:#fff;border-radius:50%;width:44px;height:44px;
  background:radial-gradient(circle at 35% 30%,#8FC5B2,var(--sage) 60%,#2F6553);box-shadow:0 0 0 3px color-mix(in srgb,var(--sage) 35%,transparent),0 6px 14px -6px var(--sage)}
.month-ctl{background:var(--surface);border:1px solid color-mix(in srgb,#fff 70%,transparent)}
nav.tabs{background:transparent;box-shadow:none;padding:4px 2px;gap:8px}
nav.tabs button{background:var(--surface);border-radius:16px;padding:10px 16px;box-shadow:var(--shadow);border:2px solid transparent;color:var(--ink)}
nav.tabs button:hover{background:var(--surface);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--accent);border-color:var(--accent)}
.seg{background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:999px}
.seg button{border-radius:999px}
.badge{border-radius:999px}
.cat-btn{background:var(--sunk);border-radius:999px}
td.amt,.kpi-val,.hb-val{font-family:var(--display);font-weight:600}
.filters input,.filters select,.field input,.field select,.field textarea{border-radius:14px;background:var(--surface)}
th{background:var(--surface)}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
dialog{background:var(--surface);border-radius:28px}
.toast{border-radius:18px}
.kpi{padding:16px 18px}
.kpi-ico{border-radius:50%}

/* status hero: ring + verdict card */
.status-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:14px;margin-bottom:14px;position:relative}
.sh-card{position:relative;overflow:hidden;border-radius:var(--radius-l);background:var(--surface);box-shadow:var(--shadow);border:1px solid color-mix(in srgb,#fff 70%,transparent);padding:18px;min-height:200px;display:flex;flex-direction:column}
.sh-card::after{content:"";position:absolute;inset:auto 0 0 0;height:46%;background:var(--tone-soft);border-top:0;z-index:0}
.sh-card svg.wave{position:absolute;left:0;right:0;bottom:46%;width:100%;height:22px;transform:translateY(50%);z-index:1}
.sh-card > *:not(.wave){position:relative;z-index:2}
.sh-ring{align-items:center;justify-content:center;gap:6px}
.sh-pill{background:var(--surface);border:2px solid color-mix(in srgb,var(--tone) 35%,transparent);border-radius:999px;padding:2px 16px;font-family:var(--display);font-weight:600}
.ring{width:132px;height:132px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-family:var(--display);font-size:2.4rem;font-weight:700;color:var(--tone);line-height:1}
.ring small{display:block;text-align:center;color:var(--muted);font-family:var(--display);font-size:.9rem}
.ring-in{position:relative;display:flex;flex-direction:column;align-items:center;background:var(--surface);width:104px;height:104px;border-radius:50%;justify-content:center;box-shadow:0 2px 10px -4px rgba(0,0,0,.2)}
.sh-verdict{gap:12px}
.verdict{display:flex;align-items:center;gap:12px}
.verdict i{font-style:normal;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--tone);color:#fff;font-weight:800;font-size:1.4rem;box-shadow:0 4px 10px -4px var(--tone);flex:none}
.verdict span{font-family:var(--display);font-weight:700;font-size:clamp(2rem,6vw,3.1rem);line-height:1;color:var(--tone)}
.bubble{margin-top:auto;background:color-mix(in srgb,var(--surface) 92%,transparent);border-radius:18px 18px 18px 6px;padding:12px 14px;font-size:1rem;line-height:1.5;box-shadow:0 2px 8px -4px rgba(0,0,0,.15)}
.tone-good{--tone:var(--sage);--tone-soft:var(--sage-soft)}
.tone-mid{--tone:var(--sand);--tone-soft:var(--sand-soft)}
.tone-bad{--tone:var(--brick);--tone-soft:var(--brick-soft)}
@media (max-width:760px){
  .status-hero{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:10px}
  .sh-card{padding:14px;min-height:180px}
  .ring{width:112px;height:112px}.ring-in{width:88px;height:88px}.ring b{font-size:2rem}
  .verdict i{width:36px;height:36px;font-size:1.1rem}
  .bubble{font-size:.9rem;padding:10px 12px}
  /* sand bottom bar with raised round buttons */
  .bnav{background:linear-gradient(var(--sand-soft),color-mix(in srgb,var(--sand-soft) 80%,var(--sand)));border-top:0;box-shadow:0 -6px 18px -12px rgba(0,0,0,.35);padding-top:0}
  .bnav{padding-top:22px;margin-top:-22px;background-clip:content-box}
  .bnav button{gap:4px;margin-top:-18px;color:color-mix(in srgb,var(--ink) 80%,var(--sand));font-family:var(--display);font-weight:600;font-size:.74rem}
  .bnav button span{filter:none;opacity:1;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:0 4px 0 color-mix(in srgb,var(--sand) 55%,transparent),0 8px 16px -8px rgba(0,0,0,.35);font-size:1.3rem}
  .bnav button[aria-selected="true"]{color:var(--accent)}
  .bnav button[aria-selected="true"] span{box-shadow:0 0 0 3px var(--accent),0 4px 0 color-mix(in srgb,var(--sand) 55%,transparent)}
  dialog::before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:var(--line);margin:-8px auto 12px}
  #addBtn{border-radius:50%;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 65%,#000 35%),0 12px 24px -8px var(--accent)}
}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}

<div class="wrap">

/* ================= storage ================= */

const Store = {
  mode:'local', db:null, uid:null, chain:{},

    let db=null, user=null;
    if (window.claude && typeof window.claude.use==='function'){
      const t = ms => new Promise(r=>setTimeout(()=>r(null),ms));
      try{ [db,user] = await Promise.all([Promise.race([claude.use('db'),t(9000)]), Promise.race([claude.use('user'),t(9000)])]); }catch(e){}
    }
    if (db && user){ try{ const id = await user.id(); if(id){ this.db=db; this.uid=id; this.mode='cloud'; } }catch(e){} }

  },
  col(){ return this.db.collection('data/users/'+this.uid); },
  async load(){
    const out = {settings:null, months:{}};
    if (this.mode==='cloud'){
      try{
        const snap = await this.col().get();
        snap.docs.forEach(d=>{
          if(!d.exists) return; const v = JSON.parse(JSON.stringify(d.data()));
          if (d.id==='settings') out.settings = v;
          else if (d.id.startsWith('m_')) out.months[d.id.slice(2)] = v.items||[];
        });
        return out;
      }catch(e){ this.mode='local'; }
    }
    try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const v=JSON.parse(raw); out.settings=v.settings||null; out.months=v.months||{}; out.del=v.del||{}; } }catch(e){}
    return out;
  },
  write(docId, body){
    if (this.mode!=='cloud'){ this.saveLocal(); return Promise.resolve(); }
    const prev = this.chain[docId] || Promise.resolve();
    const next = prev.then(async ()=>{
      try{
        if (body===null) await this.col().doc(docId).delete();
        else await this.col().doc(docId).set(body);
      }catch(e){
        if (e && e.code==='quota_exceeded') toast('האחסון מלא. מחקו חודשים ישנים כדי להמשיך לשמור.');
        else toast('השמירה נכשלה ('+(e&&e.code||'שגיאה')+'). נסו שוב בעוד רגע.');
      }
    });
    this.chain[docId] = next; return next;
  },
  saveLocal(){ if (VAULT.meta){ try{ localStorage.removeItem(LS_KEY); }catch(e){} if (VAULT.unlocked()) VAULT.queueSave(); return; } try{ localStorage.setItem(LS_KEY, JSON.stringify({settings:S.settings, months:S.months, del:S.del})); }catch(e){} },

/* ================= state ================= */
const S = { queue:[], batch:null, settings:null, months:{}, month:null, tab:'overview', filters:{q:'',type:'',nec:'',cat:'',topic:''}, imp:null, cut:25 };

const catById = id => cats().find(c=>c.id===id) || cats().find(c=>c.id==='uncat');
const effKind = t => catById(t.catId).kind==='income' ? 'income' : 'expense';
const isRefund = t => t.type==='income' && effKind(t)==='expense';
const necOf = t => effKind(t)==='income' ? null : (t.nec || catById(t.catId).nec);
const allTx = () => Object.values(S.months).flat();

const inRange = d => !!S.range && d>=S.range.from && d<=S.range.to;
/* ---- reporting basis ----
   charge basis (reports): bank rows by bank date; card rows by the date their statement was charged in the bank;
   deal basis (transactions list, optional): card rows by purchase date.
   Bank card-company charges count only when no card statement is linked to them, so totals always match the bank. */
let dataVer=0, IDX=null;
const bump=()=>{ dataVer++; };
const isCreditRow = t => t.srcKind==='credit' || (!t.srcKind && !!t.fileId && ((S.settings.files||{})[t.fileId]||{}).kind==='credit');
const isCardChargeRow = t => t.type==='expense' && (!!t.cardCharge || (t.srcKind==='bank' && CARD_CO_RE.test(t.desc)));
// one card statement = all rows of the same card charged in the same month, even if they came from several files
let FILE_MONTH={};
const dayDiff=(a,b)=>Math.abs(Date.parse(a)-Date.parse(b))/864e5;
function rowChargeDate(t){ if (t.chargeDate) return t.chargeDate; const f=(S.settings.files||{})[t.fileId]; if (f && f.map && (f.map.chargeCol??-1)>-1) return t.date; return (f && f.chargeDate) || null; }
function stmtKeyOf(t){
  const f=(S.settings.files||{})[t.fileId]; const hasC = !!t.chargeDate || (f && ((f.map && (f.map.chargeCol??-1)>-1) || f.chargeDate));
  const m = t.chargeDate ? t.chargeDate.slice(0,7) : hasC ? t.date.slice(0,7) : (FILE_MONTH[t.fileId]||t.date.slice(0,7));
  const d = digitsOf(cardName(t.card));
  return (d ? 'c'+d : (t.fileId||('card:'+(t.card||'')))) + '|' + m + (hasC ? '' : '|g');
}
const digitsOf = s => (String(s||'').match(/\d{4}(?!.*\d{4})/)||[])[0] || '';
// the credit card a bank charge belongs to: set by the user on the row, or 4 digits in the description
const chargeCardDigits = t => t.forCard ? digitsOf(cardName(t.forCard)) : digitsOf(t.desc);
function buildIdx(){
  const all=allTx(), stm={};
  FILE_MONTH={}; all.forEach(t=>{ if(isCreditRow(t) && !t.chargeDate){ const m=t.date.slice(0,7); if(!FILE_MONTH[t.fileId] || m>FILE_MONTH[t.fileId]) FILE_MONTH[t.fileId]=m; } });
  all.forEach(t=>{ if(!isCreditRow(t) || t.excluded) return; const k=stmtKeyOf(t);
    const s=(stm[k] ||= {key:k, fileId:t.fileId, files:new Set(), card:t.card, sum:0, n:0});

function totals(list){
  const r = {inc:0, exp:0, essential:0, important:0, optional:0, byCat:{}, byTopic:{}, byCard:{}, byInc:{}, refunds:0};
  for (const t of list){
    if (t.excluded) continue;
    if (isCardChargeRow(t) && chargeLinked(t)) continue;   // its card statement is counted instead
    if (effKind(t)==='income'){ r.inc+=t.amount; r.byInc[t.catId]=(r.byInc[t.catId]||0)+t.amount; continue; }
    const v = t.type==='income' ? -t.amount : t.amount;   // a refund lowers its expense category
    r.exp+=v; r[necOf(t)] += v; if (v<0) r.refunds-=v;

    r.byCat[t.catId]=(r.byCat[t.catId]||0)+v;
    const tp = catById(t.catId).topic; r.byTopic[tp]=(r.byTopic[tp]||0)+v;

}

function trendSVG(){
  let ks=[]; if (S.range){ ks=periodMonths().slice(-24); if(ks.length<2) ks=[shiftMonth(ks[0],-1),ks[0]]; } else for(let i=5;i>=0;i--) ks.push(shiftMonth(S.month,-i));
  const data = ks.map(k=>{ const T=totals(S.range?monthTx(k).filter(t=>inRange(repDate(t,S.basis||'charge'))):monthTx(k)); return {k, inc:T.inc, exp:T.exp}; });
  const max = Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
  const W=520,H=220,pad=24,gw=(W-pad*2)/ks.length,bw=Math.max(3,Math.min(22,gw/2-3)), hl=S.range?null:S.month;
  let s=`<svg viewBox="0 0 ${W} ${H+28}" role="img" aria-label="הכנסות והוצאות לפי חודש">`;
  [0.5,1].forEach(f=>{ const y=H-(H-pad)*f; s+=`<line x1="${pad}" x2="${W-pad}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${W-pad+2}" y="${y+4}" text-anchor="start">${fmt(max*f)}</text>`; });
  data.forEach((d,i)=>{
    // RTL: newest on the left
    const cx = W - pad - gw*(i+0.5);
    const hi=(H-pad)*d.inc/max, he=(H-pad)*d.exp/max;
    s+=`<rect x="${cx}" y="${H-hi}" width="${bw}" height="${hi}" rx="3" fill="var(--inc)"><title>הכנסות ${fmt(d.inc)}</title></rect>`;
    s+=`<rect x="${cx-bw-3}" y="${H-he}" width="${bw}" height="${he}" rx="3" fill="var(--exp)" opacity="${!hl||d.k===hl?1:.75}"><title>הוצאות ${fmt(d.exp)}</title></rect>`;
    if (ks.length<=8 || i%Math.ceil(ks.length/8)===0) s+=`<text x="${cx}" y="${H+18}" text-anchor="middle" style="${d.k===hl?'font-weight:700;fill:var(--ink)':''}">${ks.length>6?monthName(d.k).slice(0,3)+" '"+d.k.slice(2,4):monthName(d.k)}</text>`;
  });
  s+=`<line x1="${pad}" x2="${W-pad}" y1="${H}" y2="${H}" stroke="var(--line)"/></svg>`;
  return s;
}

// Israeli bank exports come in many shapes: real Excel, old Excel (BIFF) without a code page,
// or text/HTML saved as ".xls" in Windows-1255, UTF-8 or UTF-16. Detect by content, not by file name.
function decodeText(buf, enc){
  const b=new Uint8Array(buf);
  if (enc && enc!=='auto'){ try{ return new TextDecoder(enc).decode(buf).replace(/^\uFEFF/,''); }catch(e){} }
  if (b[0]===0xFF && b[1]===0xFE) return new TextDecoder('utf-16le').decode(buf).replace(/^\uFEFF/,'');
  if (b[0]===0xFE && b[1]===0xFF) return new TextDecoder('utf-16be').decode(buf).replace(/^\uFEFF/,'');
  // UTF-16 without BOM: every other byte is zero
  let z=0; for (let i=1;i<Math.min(b.length,400);i+=2) if(b[i]===0) z++;
  if (z>60) return new TextDecoder('utf-16le').decode(buf);
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf).replace(/^\uFEFF/,''); }
  catch(e){ try{ return new TextDecoder('windows-1255').decode(buf); }catch(_){ return new TextDecoder().decode(buf); } }
}
// repair Hebrew that was decoded with the wrong code page
function fixHeb(s){
  if (typeof s!=='string' || /[\u0590-\u05FF]/.test(s)) return s;
  if (/×[\u0080-\u00BF]/.test(s) && [...s].every(c=>c.charCodeAt(0)<256)){   // UTF-8 bytes read as Latin-1
    try{ return new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from([...s].map(c=>c.charCodeAt(0)))); }catch(e){}
  }
  if (/[\u00E0-\u00FA]{2,}/.test(s)) return s.replace(/[\u00E0-\u00FA]/g, c=>String.fromCharCode(0x05D0 + c.charCodeAt(0)-0xE0));   // Windows-1255 read as Latin-1
  return s;
}
async function readFile(file, enc){
  if (typeof XLSX==='undefined') throw new Error('ספריית קריאת הקבצים לא נטענה. רעננו את העמוד ונסו שוב.');
  const buf = await file.arrayBuffer(), b=new Uint8Array(buf);
  const isZip = b[0]===0x50 && b[1]===0x4B;                                   // .xlsx

async function handleFile(file, replaceId){
  try{
    const rows=await readFile(file);
    if(rows.length<2){ toast('הקובץ ריק או שאין בו טבלה שאפשר לקרוא.'); return; }
    const pr=prepareImport(rows, file.name);
    S.batch=null; S.imp={srcFile:file, name:file.name, path:'upload:'+file.name, rows, map:pr.map, cardName:pr.cardName||cardHint(rows,file.name)||'', replaceFileId:replaceId||null};
    if (pr.fileCharge!==undefined) S.imp.fileCharge=pr.fileCharge;
    S.tab='import'; render();
  }catch(e){ toast(e.message && /ספרייה|ספריית/.test(e.message)? e.message : 'לא הצלחתי לקרוא את הקובץ. ודאו שזה Excel או CSV.'); }
}

/* ---------- merchant history ---------- */
const merchKey = s => stripInst(s).replace(/\d+/g,' ').replace(/[-–_.,*#]+/g,' ').replace(/\s+/g,' ').trim();
let merchCtx=null;
function openMerchant(desc, type){
  merchCtx={desc, type, similar:false};
  document.getElementById('merchTitle').textContent=desc.replace(/תשלום\s*\d+\s*(מתוך|מ-|\/)\s*\d+/g,'').trim();
  renderMerch(); const d=document.getElementById('merchDlg'); if(!d.open) d.showModal();
}
function merchList(similar){
  const k=merchKey(merchCtx.desc), first=(k.split(' ').find(w=>w.length>=2)||'');
  return allTx().filter(t=>t.type===merchCtx.type && (merchKey(t.desc)===k || (similar && first && merchKey(t.desc).split(' ').includes(first))))
    .sort((a,b)=>b.date.localeCompare(a.date));
}
function renderMerch(){
  const box=document.getElementById('merchBody'), list=merchList(merchCtx.similar), more=merchList(true).length-merchList(false).length;
  if (!list.length){ box.innerHTML='<p class="muted">לא נמצאו עסקאות.</p>'; return; }
  const listInc=list.filter(t=>!t.excluded), total=listInc.reduce((a,t)=>a+t.amount,0), lastM=list[0].date.slice(0,7), firstM=list[list.length-1].date.slice(0,7);
  const span=mDiff(lastM,firstM)+1, activeMonths=new Set(list.map(t=>t.date.slice(0,7))).size;
  const catIds=[...new Set(list.map(t=>t.catId))];
  const isInc=merchCtx.type==='income';
  // monthly bars (up to 24 months)
  const from = span>24 ? shiftMonth(lastM,-23) : firstM, ks=[]; for(let k=from; k<=lastM; k=shiftMonth(k,1)) ks.push(k);
  const byM={}; list.forEach(t=>{ const k=t.date.slice(0,7); byM[k]=(byM[k]||0)+(t.excluded?0:t.amount); });
  const max=Math.max(1,...ks.map(k=>byM[k]||0)), W=700, H=110, pad=16, gw=(W-pad*2)/ks.length, bw=Math.max(4,Math.min(28,gw-6));
  let svg=`<svg viewBox="0 0 ${W} ${H+24}" role="img" aria-label="סכום לפי חודש">`;
  ks.forEach((k,i)=>{ const v=byM[k]||0, cx=W-pad-gw*(i+0.5), hh=(H-10)*v/max;
    svg+=`<rect x="${cx-bw/2}" y="${H-hh}" width="${bw}" height="${Math.max(hh,v?2:0)}" rx="2" fill="${isInc?'var(--inc)':'var(--accent)'}"><title>${monthLabel(k)}: ${fmt(v)}</title></rect>`;
    if (ks.length<=12 || i%Math.ceil(ks.length/12)===0) svg+=`<text x="${cx}" y="${H+16}" text-anchor="middle">${monthName(k).slice(0,3)}${k.endsWith('-01')||i===0?" '"+k.slice(2,4):''}</text>`; });
  svg+=`<line x1="${pad}" x2="${W-pad}" y1="${H}" y2="${H}" stroke="var(--line)"/></svg>`;
  box.innerHTML = `
    <div style="display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;margin-top:8px">
      <span>סיווג: ${catIds.length===1?`<button class="cat-btn ${catIds[0]==='uncat'?'is-uncat':''}" id="mhCatAll">${esc(catById(catIds[0]).name)} ▾</button>`:`<button class="cat-btn" id="mhCatAll">${catIds.length} סיווגים שונים ▾</button>`}</span>
      ${more>0||merchCtx.similar?`<label class="chk" style="font-weight:400"><input type="checkbox" id="mhSimilar" ${merchCtx.similar?'checked':''}> כולל שמות דומים${more>0?` (עוד ${more})`:''}</label>`:''}
    </div>

      <div class="stat"><span>סה״כ</span><b>${fmt(total)}</b></div>
      <div class="stat"><span>עסקאות</span><b>${listInc.length}${list.length>listInc.length?`<span style="font-family:var(--sans);font-size:.8rem;color:var(--muted)"> +${list.length-listInc.length} לא בדוחות</span>`:''}</b></div>
      <div class="stat"><span>ממוצע לעסקה</span><b>${fmt(listInc.length?total/listInc.length:0)}</b></div>
      <div class="stat"><span>ממוצע לחודש</span><b>${fmt(total/span)}</b></div>
      <div class="stat"><span>תקופה</span><b style="font-size:1rem">${firstM===lastM?monthLabel(firstM):monthLabel(firstM)+' – '+monthLabel(lastM)}</b></div>
    </div>
    ${activeMonths>1?`<div class="trend" style="margin-bottom:12px">${svg}</div>`:''}
    <div class="table-wrap" style="max-height:46vh;overflow:auto"><table>
      <thead><tr><th>תאריך</th><th>תיאור</th><th>סיווג</th><th>כרטיס</th><th style="text-align:center">בדוחות</th><th style="text-align:left">סכום</th></tr></thead>
      <tbody>${list.map(t=>`<tr data-mid="${t.id}" class="${t.excluded?'is-excl':''}">
        <td style="white-space:nowrap"><button class="desc-btn" data-goto title="מעבר לחודש">${t.date.split('-').reverse().join('/')}</button></td>
        <td>${esc(t.desc)}${t.inst?`<span class="inst-tag">תשלום ${t.inst.n}/${t.inst.of}</span>`:''}</td>
        <td><button class="cat-btn ${t.catId==='uncat'?'is-uncat':''}" data-mcat>${esc(catById(t.catId).name)} ▾</button></td>
        <td class="card-tag">${esc(cardName(t.card)||'—')}</td>

        <td class="amt ${isInc?'inc':''}">${fmt2(t.amount)}</td></tr>`).join('')}</tbody></table></div>

  });

/* ---------- loans ---------- */
const isLoanCat = c => !!c && c.kind==='expense' && (c.id==='loans' || c.loan || /הלוואה|הלוואות/.test(c.name));
function loanList(){
  const groups={}, L=S.settings.loans||{}, ref=refMonth();
  allTx().filter(t=>t.type==='expense' && !t.excluded && isLoanCat(catById(t.catId))).forEach(t=>{ const k=t.loanKey||('k:'+merchKey(t.desc)); (groups[k] ||= []).push(t); });
  Object.keys(L).forEach(k=>{ if(!groups[k] && L[k].manual) groups[k]=[]; });
  return Object.entries(groups).map(([key,txs])=>{
    txs.sort((a,b)=>a.date.localeCompare(b.date));
    const d=L[key]||{}, toRef=txs.filter(t=>t.date.slice(0,7)<=ref), last=txs[txs.length-1], lastRef=toRef[toRef.length-1];
    const monthly = +d.monthly || (lastRef||last||{}).amount || 0, N = +d.months || 0;
    let n;
    if (txs.length) n = toRef.length + (+d.offset||0);
    else n = d.start ? Math.max(0, mDiff(ref, d.start)+1) : 0;
    if (N) n=Math.max(0,Math.min(n,N));

async function openWithRaw(raw){
  VAULT.raw=new Uint8Array(raw);
  VAULT.dek=await crypto.subtle.importKey('raw',VAULT.raw,{name:'AES-GCM'},false,['encrypt','decrypt']);
  const d=VAULT.meta.data; if(!d) return {};
  return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d.iv},VAULT.dek,d.ct)));
}
async function unlockWithPin(pin){ const p=VAULT.meta.pin; const kek=await pinKEK(pin,p.salt); const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:p.iv},kek,p.wk); return openWithRaw(raw); }
async function passkeyPRF(credId, prfSalt, create){
  if (create){
    const cred=await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)), rp:{name:'תזרים', id:location.hostname},
      user:{id:crypto.getRandomValues(new Uint8Array(16)), name:'money-manager@'+location.hostname, displayName:'תזרים'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred'},
      timeout:60000, extensions:{prf:{eval:{first:prfSalt}}}}});
    const ext=cred.getClientExtensionResults()||{};
    if (!ext.prf || ext.prf.enabled===false) throw new Error('noprf');
    const first=ext.prf.results && ext.prf.results.first;
    return {credId:new Uint8Array(cred.rawId), out:first||null};
  }
  const a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)), rpId:location.hostname,
    allowCredentials:[{type:'public-key', id:credId}], userVerification:'required', timeout:60000, extensions:{prf:{eval:{first:prfSalt}}}}});
  const r=(a.getClientExtensionResults()||{}).prf; const out=r && r.results && r.results.first;
  if (!out) throw new Error('noprf');
  return {out};
}
async function unlockWithBio(){ const b=VAULT.meta.bio; const {out}=await passkeyPRF(b.credId,b.prfSalt,false); const kek=await prfKEK(out,b.hkdfSalt); const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.iv},kek,b.wk); return openWithRaw(raw); }
async function createVault(pin){
  const raw=crypto.getRandomValues(new Uint8Array(32)), salt=crypto.getRandomValues(new Uint8Array(16));
  const kek=await pinKEK(pin,salt), w=await wrapRaw(kek,raw);
  VAULT.meta={v:1, created:new Date().toISOString(), autoLock:5, pin:{salt, iv:w.iv, wk:w.wk}, bio:null, data:null, fails:0};
  await openWithRaw(raw); await VAULT.save();
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  await encryptRowCaches();
  try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
}
async function addBio(){
  const prfSalt=crypto.getRandomValues(new Uint8Array(32)), hkdfSalt=crypto.getRandomValues(new Uint8Array(16));
  let {credId, out}=await passkeyPRF(null, prfSalt, true);
  if (!out) out=(await passkeyPRF(credId, prfSalt, false)).out;   // Safari returns the PRF value only on sign-in
  const kek=await prfKEK(out,hkdfSalt), w=await wrapRaw(kek,VAULT.raw);
  VAULT.meta.bio={credId, prfSalt, hkdfSalt, iv:w.iv, wk:w.wk, added:new Date().toISOString()};
  await IDB.set('vault', VAULT.meta);
}
async function changePin(pin){ const salt=crypto.getRandomValues(new Uint8Array(16)); const w=await wrapRaw(await pinKEK(pin,salt),VAULT.raw); VAULT.meta.pin={salt, iv:w.iv, wk:w.wk}; await IDB.set('vault',VAULT.meta); }
function bioErr(e){
  const n=e && (e.name||e.message)||'';
  if (n==='noprf') return 'המכשיר או הדפדפן לא תומכים בפתיחה מוצפנת עם Face ID (נדרש iOS 18 ומעלה, או Chrome באנדרואיד). אפשר להמשיך עם הקוד האישי.';
  if (n==='NotAllowedError') return 'הזיהוי בוטל או לא הצליח.';
  if (n==='SecurityError') return 'Face ID זמין רק כשהמערכת פתוחה מכתובת https (כמו האתר ב-GitHub Pages).';
  return 'הזיהוי הביומטרי נכשל ('+n+').';
}
// the original rows of each loaded file (for "load again"): encrypted with the same key when the lock is on
async function rowsPut(fid, obj){
  if (VAULT.unlocked()){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},VAULT.dek,te.encode(JSON.stringify(obj))); return IDB.set('rows:'+fid,{enc:true,iv,ct}); }
  if (VAULT.meta) return;            // locked: never write plain data
  return IDB.set('rows:'+fid,obj);
}
async function rowsGet(fid){
  const c=await IDB.get('rows:'+fid); if(!c) return null;
  if (c.enc){ if(!VAULT.unlocked()) return null; try{ return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:c.iv},VAULT.dek,c.ct))); }catch(e){ return null; } }
  return c;
}
async function encryptRowCaches(){
  if (!VAULT.unlocked()) return;
  for (const k of await IDB.keys('rows:')){ const c=await IDB.get(k); if(c && !c.enc) await rowsPut(k.slice(5), c); }
}

}

    try{ const td=await this.dir.getDirectoryHandle('transactions');
      for await (const [n,hd] of td.entries()){ const m=n.match(/^(\d{4}-\d{2})\.json$/); if(hd.kind==='file' && m){ const r=await this.readJSON(td,n); if(r && Array.isArray(r.data.items)){ months[m[1]]=r.data.items; if(r.data.deleted) del[m[1]]=delMap(r.data.deleted); } } } }catch(e){}

    if (r.status===401){ this.expired(); throw new Error('expired'); }

async function driveConnect(){

async function scanDriveData(interactive){

    const fs=await GD.list(GD.dataId);
    const items=fs.filter(f=>f.mimeType===GSHEET_MIME || isSheet(f.name)).map(f=>({path:'gdrive:'+f.id,
      file:{name:isSheet(f.name)?f.name:f.name+'.xlsx', displayName:f.name, mime:f.mimeType, source:'drive', size:+f.size||0, lastModified:Date.parse(f.modifiedTime), arrayBuffer:()=>GD.download(f)}}));

const FAMILY={ enabled:false, key:null, raw:null, check:null, pending:null };
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function b32enc(bytes){ let bits=0, val=0, out=''; for(const b of bytes){ val=(val<<8)|b; bits+=8; while(bits>=5){ out+=B32[(val>>>(bits-5))&31]; bits-=5; } } if(bits>0) out+=B32[(val<<(5-bits))&31]; return out; }

function b64e(buf){ const a=new Uint8Array(buf); let s=''; for(let i=0;i<a.length;i+=0x8000) s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000)); return btoa(s); }

const IDB={ p:null,
  open(){ return this.p ||= new Promise((res,rej)=>{ const r=indexedDB.open('money-manager',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async run(mode,fn){ try{ const db=await this.open(); return await new Promise((res,rej)=>{ const tx=db.transaction('kv',mode); const q=fn(tx.objectStore('kv')); tx.oncomplete=()=>res(q&&q.result); tx.onerror=()=>rej(tx.error); }); }catch(e){ return null; } },
  get(k){ return this.run('readonly',s=>s.get(k)); }, set(k,v){ return this.run('readwrite',s=>s.put(v,k)); }, del(k){ return this.run('readwrite',s=>s.delete(k)); },
  keys(pre){ return this.run('readonly',s=>s.getAllKeys()).then(a=>(a||[]).filter(k=>String(k).startsWith(pre))); },
  clearPrefix(pre){ return this.run('readwrite',s=>{ const q=s.openCursor(); q.onsuccess=()=>{ const c=q.result; if(!c) return; if(String(c.key).startsWith(pre)) c.delete(); c.continue(); }; return q; }); }
};
async function collectDir(handle, prefix='', depth=0, out=[]){
  for await (const [name,hd] of handle.entries()){
    if (hd.kind==='file' && isSheet(name)) out.push({file:await hd.getFile(), path:prefix+name});
    else if (hd.kind==='directory' && depth<2) await collectDir(hd, prefix+name+'/', depth+1, out);
  }
  return out;
}

/* ---------- savings ---------- */
function analysis(){
  let winList, nM, cur, P, pN, hasPrev, spanList, window3;
  if (S.range){
    winList=periodTx(); window3=periodMonths().filter(m=>monthTx(m).length);
    nM=periodLenMonths(); cur=totals(winList);
    const days=Math.round((new Date(S.range.to)-new Date(S.range.from))/864e5)+1;
    const pTo=new Date(new Date(S.range.from).getTime()-864e5), pFrom=new Date(pTo.getTime()-(days-1)*864e5);
    const iso=d=>d.toISOString().slice(0,10), pf=iso(pFrom), pt=iso(pTo);
    const prevList=allTx().filter(t=>{ const d=repDate(t,S.basis||'charge'); return d>=pf && d<=pt; });
    P=totals(prevList); pN=1; hasPrev=prevList.length>0;
    // compare whole periods: scale current to the same basis
    spanList=window3;
  } else {
    const k=S.month, prev=[shiftMonth(k,-1),shiftMonth(k,-2),shiftMonth(k,-3)];
    window3=[k,prev[0],prev[1]].filter(m=>monthTx(m).length);
    nM=Math.max(1,window3.length); winList=window3.flatMap(m=>monthTx(m));
    cur=totals(monthTx(k));
    const prevMonths=prev.filter(m=>monthTx(m).length);
    P=totals(prevMonths.flatMap(m=>monthTx(m))); pN=Math.max(1,prevMonths.length); hasPrev=prevMonths.length>0;
    spanList=[k,...prev].filter(m=>monthTx(m).length);
  }
  const W=totals(winList);
  const avg = v => v/nM;

  const flexible = Object.entries(W.byCat).map(([id,v])=>({c:catById(id), avg:avg(v)}))
    .filter(x=>x.c.nec!=='essential' && x.c.id!=='uncat').sort((a,b)=>b.avg-a.avg);

  // recurring: same normalized description in >=2 months of last 3-4, similar amount
  const span=spanList;
  const byDesc={};
  span.forEach(m=>monthTx(m).filter(t=>!S.range||inRange(repDate(t,S.basis||'charge'))).filter(t=>t.type==='expense' && !t.inst && !t.excluded).forEach(t=>{ const d=norm(t.desc).replace(/\d+/g,'').trim(); ((byDesc[d] ||= {desc:t.desc,months:{},catId:t.catId}).months[m] ||= []).push(t.amount); }));
  const recurring = Object.values(byDesc).map(x=>{ const ms=Object.keys(x.months); if(ms.length<2) return null;
      const per=ms.map(m=>x.months[m].reduce((a,b)=>a+b,0)); const mean=per.reduce((a,b)=>a+b,0)/per.length;
      const stable=per.every(v=>Math.abs(v-mean)<=Math.max(15,mean*0.2)); const cnt=ms.map(m=>x.months[m].length);
      if(!stable || Math.max(...cnt)>3) return null; return {desc:x.desc, monthly:mean, n:ms.length, cat:catById(x.catId)}; })
    .filter(Boolean).filter(x=>x.cat.nec!=='essential' || x.cat.id==='insurance' || x.cat.id==='phone').sort((a,b)=>b.monthly-a.monthly).slice(0,12);

  // small frequent purchases this window
  const smallG={};
  winList.filter(t=>!t.excluded && t.type==='expense' && t.amount<=60 && necOf(t)!=='essential').forEach(t=>{ const g=(smallG[t.catId] ||= {c:catById(t.catId),n:0,sum:0}); g.n++; g.sum+=t.amount; });
  const small=Object.values(smallG).filter(g=>g.n>=4).map(g=>({...g, n:g.n/nM, sum:g.sum/nM})).sort((a,b)=>b.sum-a.sum);

  // rises vs previous months
  const rises = hasPrev? Object.entries(cur.byCat).map(([id,v])=>{ const p=(P.byCat[id]||0)/pN; return {c:catById(id), cur:v, prev:p, diff:v-p}; })
    .filter(x=>x.diff>=150 && x.cur>x.prev*1.25 && x.c.id!=='uncat').sort((a,b)=>b.diff-a.diff).slice(0,6) : [];

  return {nM, W, avg, cur, flexible, recurring, small, rises, months:window3};
}

let updLater=0, updFound=null;
async function checkUpdate(manual){

    if (!r.ok) throw new Error(r.status);
    const m=(await r.text()).match(/const APP_VERSION='([^']+)'/);

    else if (manual) toast(`מותקנת הגרסה העדכנית (${APP_VERSION}).`);
  }catch(e){ if(manual) toast('לא ניתן לבדוק עדכונים כרגע. בדקו את החיבור לאינטרנט.'); }

  if (GD.available() && GD.clientId() && GD.folderId()){
    document.getElementById('projBanner').innerHTML=`<div class="panel" style="margin:10px 0 0;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-color:var(--accent)"><span>הנתונים המשותפים שמורים ב-Google Drive.</span><button class="btn primary small" id="gdBanner">התחברות עם Google</button></div>`;
    document.getElementById('gdBanner').onclick=driveConnect;
  }
  render();
  if (FS_API){ dirHandle = await IDB.get('dir'); if (dirHandle){ if(S.tab==='import' && !S.imp) renderImport(); scanFolder(false); } }
  if (window.claude && typeof window.claude.use==='function'){
    claude.use('sample').then(s=>{ sampleNs=s; if(S.tab==='save') render(); }).catch(()=>{});
    claude.use('downloads').then(d=>{ downloadsNs=d; if(S.tab==='save') render(); }).catch(()=>{});
  }
})();
})();
</script>
